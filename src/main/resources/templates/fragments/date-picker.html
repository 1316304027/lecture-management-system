<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- カレンダー形式日付選択（Flatpickr） inputName=POSTパラメータ名 inputId=一意ID -->
<div th:fragment="picker(inputName, label, inputId)" class="pcfa-date-field">
    <label class="form-label small mb-1 fw-semibold" th:text="${label}">日付</label>
    <input type="text"
           th:name="${inputName}"
           th:id="${inputId}"
           class="form-control form-control-sm pcfa-flatpickr"
           placeholder="クリックして日付を選択"
           autocomplete="off"
           required>
</div>
</body>
</html>
