<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="chatRoom(messages, loginUser, courseId, sendAction, showDelete)">
    <div class="pcfa-chat-room panel mb-0">
        <div class="pcfa-chat-messages" id="chatBox">
            <th:block th:each="msg, stat : ${messages}">
                <div th:if="${stat.index == 0 or #temporals.format(messages[stat.index - 1].sentAt, 'yyyy/MM/dd') != #temporals.format(msg.sentAt, 'yyyy/MM/dd')}"
                     class="pcfa-chat-date-divider">
                    <span th:text="${#temporals.format(msg.sentAt, 'yyyy年M月d日')}"></span>
                </div>
                <div th:if="${msg.sender.id == loginUser.id}" class="pcfa-msg-row mine">
                    <div class="pcfa-msg-block">
                        <div class="pcfa-msg-meta text-end"
                             th:text="${#temporals.format(msg.sentAt, 'HH:mm')}"></div>
                        <div class="pcfa-msg-bubble mine">
                            <span th:text="${msg.content}"></span>
                            <form th:if="${showDelete}" class="pcfa-msg-delete"
                                  th:action="@{/admin/chat/delete/{id}(id=${msg.id})}" method="post"
                                  onsubmit="return confirm('このメッセージを削除しますか？')">
                                <input type="hidden" name="courseId" th:value="${courseId}">
                                <button type="submit" class="btn btn-link btn-sm text-white-50 p-0" title="削除">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div th:unless="${msg.sender.id == loginUser.id}" class="pcfa-msg-row other">
                    <span class="pcfa-msg-avatar pcfa-nav-initials" aria-hidden="true">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <div class="pcfa-msg-block">
                        <div class="pcfa-msg-meta">
                            <span class="pcfa-role-chip"
                                  th:classappend="${msg.sender.role == 'ADMIN'} ? ' role-admin' :
                                                  (${msg.sender.role == 'INSTRUCTOR'} ? ' role-instructor' : ' role-student')"
                                  th:text="${msg.sender.role == 'ADMIN'} ? '管理者' :
                                           (${msg.sender.role == 'INSTRUCTOR'} ? '講師' : '受講者')"></span>
                            <strong th:text="${msg.sender.name}"></strong>
                            <time th:text="${#temporals.format(msg.sentAt, 'HH:mm')}"></time>
                        </div>
                        <div class="pcfa-msg-bubble other" th:text="${msg.content}"></div>
                    </div>
                </div>
            </th:block>
            <div th:if="${messages.empty}" class="pcfa-chat-empty text-muted">
                <i class="bi bi-chat-heart display-6 d-block mb-2 opacity-50"></i>
                <p class="mb-0">まだメッセージはありません。<br class="d-sm-none">下の入力欄から会話を始めましょう。</p>
            </div>
        </div>
        <div class="pcfa-chat-compose">
            <form th:action="${sendAction}" method="post" id="chatForm" class="pcfa-chat-form">
                <input type="hidden" name="courseId" th:value="${courseId}">
                <div class="pcfa-chat-input-row">
                    <textarea name="content" id="messageInput" class="pcfa-chat-input" rows="1"
                              placeholder="メッセージを入力…"
                              maxlength="500" required autocomplete="off"></textarea>
                    <button type="submit" class="pcfa-chat-send-btn" aria-label="送信">
                        <i class="bi bi-send-fill" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="pcfa-chat-hint">Enterで送信 · Shift+Enterで改行</p>
            </form>
        </div>
    </div>
    <script>
    (function () {
        var box = document.getElementById('chatBox');
        if (box) box.scrollTop = box.scrollHeight;
        var input = document.getElementById('messageInput');
        var form = document.getElementById('chatForm');
        if (!input || !form) return;
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (input.value.trim()) form.submit();
            }
        });
        input.addEventListener('input', function () {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';
        });
        input.focus();
    })();
    </script>
</th:block>
</body>
</html>
