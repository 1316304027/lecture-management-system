<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout (title, activeNav, main, extraHead, extraScripts, fluid)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">PCFA</title>
    <link rel="stylesheet" th:href="@{/adminhmd/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/adminhmd/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/adminhmd/css/style.css}">
    <link rel="stylesheet" th:href="@{/adminhmd/pcfa-admin.css}">
    <th:block th:replace="${extraHead} ?: ~{}"></th:block>
</head>
<body th:with="displayUser=${realAdminUser != null ? realAdminUser : loginUser}">
<div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <aside class="admin-sidebar" id="adminSidebar" aria-label="管理者メニュー">
        <div class="sidebar-header">
            <a class="brand-mark" th:href="@{/admin/home}" aria-label="PCFA 管理者ホーム">
                <span class="brand-icon"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i></span>
                <span class="brand-copy">
                    <span class="brand-title">PCFA</span>
                    <span class="brand-subtitle">受講管理システム</span>
                </span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/admin/home}"
               th:classappend="${activeNav == 'home'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'home'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-speedometer2" aria-hidden="true"></i></span>
                <span class="nav-text">ホーム</span>
            </a>
            <a class="nav-link" th:href="@{/admin/accounts}"
               th:classappend="${activeNav == 'accounts'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'accounts'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-people" aria-hidden="true"></i></span>
                <span class="nav-text">ユーザー管理</span>
            </a>
            <a class="nav-link" th:href="@{/admin/courses}"
               th:classappend="${activeNav == 'courses'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'courses'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-journal-bookmark" aria-hidden="true"></i></span>
                <span class="nav-text">コース管理</span>
            </a>
            <a class="nav-link" th:href="@{/admin/attendance}"
               th:classappend="${activeNav == 'attendance'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'attendance'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-calendar-check" aria-hidden="true"></i></span>
                <span class="nav-text">出欠修正</span>
            </a>
            <a class="nav-link" th:href="@{/admin/reports}"
               th:classappend="${activeNav == 'reports'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'reports'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-bar-chart-line" aria-hidden="true"></i></span>
                <span class="nav-text">実績レポート</span>
            </a>
            <a class="nav-link" th:href="@{/admin/chat}"
               th:classappend="${activeNav == 'chat'} ? ' active' : ''"
               th:attr="aria-current=${activeNav == 'chat'} ? 'page' : null">
                <span class="nav-icon"><i class="bi bi-chat-dots" aria-hidden="true"></i></span>
                <span class="nav-text">チャット閲覧</span>
            </a>
        </nav>

        <div class="sidebar-user" th:if="${displayUser != null}">
            <img th:if="${adminNavAvatarUrl != null}" class="avatar-img avatar-md sidebar-user-avatar"
                 th:src="${adminNavAvatarUrl}" th:alt="${displayUser.name}">
            <span th:unless="${adminNavAvatarUrl != null}"
                  class="avatar-img avatar-md sidebar-user-avatar pcfa-nav-initials"
                  th:text="${#strings.substring(displayUser.name,0,1)}">管</span>
            <strong th:text="${displayUser.name}">管理者</strong>
            <small>管理者ワークスペース</small>
        </div>

        <div class="sidebar-footer">
            <span class="status-dot"></span>
            <span class="sidebar-footer-text">PCFA 研修管理</span>
        </div>
    </aside>

    <div class="admin-main">
        <nav class="navbar admin-navbar navbar-expand bg-white">
            <div class="container-fluid px-3 px-lg-4">
                <button class="sidebar-toggle" type="button" data-sidebar-toggle
                        aria-controls="adminSidebar" aria-expanded="true" aria-label="メニュー">
                    <span></span><span></span><span></span>
                </button>
                <div class="navbar-actions ms-auto">
                    <button class="icon-button theme-toggle" type="button" data-theme-toggle
                            aria-label="テーマ切替" title="テーマ切替">
                        <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
                    </button>
                    <div class="dropdown">
                        <button class="profile-button dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <img th:if="${adminNavAvatarUrl != null}" class="avatar-img avatar-sm"
                                 th:src="${adminNavAvatarUrl}" th:alt="${displayUser != null ? displayUser.name : 'Admin'}">
                            <span th:unless="${adminNavAvatarUrl != null}"
                                  class="avatar-img avatar-sm pcfa-nav-initials"
                                  th:text="${displayUser != null ? #strings.substring(displayUser.name,0,1) : '管'}">管</span>
                            <span class="profile-name d-none d-sm-inline"
                                  th:text="${displayUser != null ? displayUser.name : '管理者'}">管理者</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/admin/home}"><i class="bi bi-speedometer2 me-2"></i>ホーム</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>ログアウト</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <main class="dashboard-content">
            <th:block th:if="${fluid}">
                <div class="pcfa-fluid-root" th:replace="${main}"></div>
            </th:block>
            <div th:unless="${fluid}" class="container-fluid px-3 px-lg-4 py-4">
                <div th:replace="${main}"></div>
            </div>
        </main>

        <footer class="admin-footer">
            <div class="container-fluid px-3 px-lg-4">
                <span>PCFA 受講管理システム — 管理者ポータル</span>
            </div>
        </footer>
    </div>
</div>

<script th:src="@{/adminhmd/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/adminhmd/js/main.js}"></script>
<th:block th:replace="${extraScripts} ?: ~{}"></th:block>
</body>
</html>
