<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>提出履歴 | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/student/home}"><i class="bi bi-arrow-left"></i> ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-clock-history"></i></span>
            <div>
                <p class="eyebrow mb-1">Submissions</p>
                <h1 class="h3 mb-1">提出履歴</h1>
            </div>
        </div>
    </div>

    <section class="panel mb-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>課題</th>
                    <th>ファイル名</th>
                    <th>提出日時</th>
                    <th>点数</th>
                    <th>評価</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="submission : ${submissionList}">
                    <td th:text="${submission.assignment.title}"></td>
                    <td>
                        <a th:href="@{/submissions/download/{id}(id=${submission.id})}"
                           th:text="${submission.originalFileName}"></a>
                    </td>
                    <td th:text="${#temporals.format(submission.submittedAt, 'yyyy/MM/dd HH:mm')}"></td>
                    <td th:text="${submission.score}"></td>
                    <td th:text="${submission.evaluationComment}"></td>
                </tr>
                <tr th:if="${submissionList.empty}">
                    <td colspan="5" class="text-muted text-center py-4">提出履歴はありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
