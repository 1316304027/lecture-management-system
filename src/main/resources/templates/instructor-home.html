<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>講師ホーム | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="page-heading mb-4">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-speedometer2" aria-hidden="true"></i></span>
            <div>
                <p class="eyebrow mb-1">Instructor Portal</p>
                <h1 class="h3 mb-1">講師ホーム</h1>
                <p class="text-muted mb-0" th:text="'ようこそ、' + ${loginUser.name} + ' 先生。'"></p>
            </div>
        </div>
        <div class="heading-actions">
            <a th:href="@{/instructor/profile}" class="btn btn-light btn-sm">
                <i class="bi bi-person-circle me-1"></i>プロフィール編集
            </a>
        </div>
    </div>

    <div th:if="${courseList.empty}" class="pcfa-empty-state">
        <p class="text-muted mb-0">担当コースがありません。管理者にコースへの割り当てを依頼してください。</p>
    </div>

    <section class="row g-3 mb-4" th:unless="${courseList.empty}" aria-label="サマリー">
        <div class="col-6 col-md-3">
            <article class="metric-card metric-primary h-100">
                <div class="metric-top"><span class="metric-label">担当コース</span><span class="metric-icon"><i class="bi bi-journal-bookmark"></i></span></div>
                <div class="metric-value" th:text="${courseList.size()}">0</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-success h-100">
                <div class="metric-top"><span class="metric-label">授業予定</span><span class="metric-icon"><i class="bi bi-calendar-check"></i></span></div>
                <div class="metric-value" th:text="${scheduleRows != null ? scheduleRows.size() : 0}">0</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-warning h-100">
                <div class="metric-top"><span class="metric-label">未読チャット</span><span class="metric-icon"><i class="bi bi-chat-dots"></i></span></div>
                <div class="metric-value" th:text="${totalUnreadChat}">0</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-primary h-100">
                <div class="metric-top"><span class="metric-label">本日の授業</span><span class="metric-icon"><i class="bi bi-clock"></i></span></div>
                <div class="metric-value" th:text="${todayLessonCount}">0</div>
            </article>
        </div>
    </section>

    <section id="admin-notices" class="panel mb-4 pcfa-admin-notices"
             th:if="${adminNotices != null and !adminNotices.empty}">
        <div class="panel-header d-flex align-items-center gap-2">
            <h2 class="h6 mb-0 section-title">
                <i class="bi bi-bell-fill text-warning"></i>
                <span>管理者からのお知らせ</span>
            </h2>
            <span class="badge text-bg-warning text-dark ms-1" th:text="${adminNotices.size()} + '件'"></span>
        </div>
        <div class="pcfa-scroll-panel">
        <ul class="list-group list-group-flush mb-0">
            <li class="list-group-item pcfa-notice-item" th:each="n : ${adminNotices}">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                    <strong class="small" th:text="${n.title}">タイトル</strong>
                    <time class="text-muted small flex-shrink-0"
                          th:text="${#temporals.format(n.createdAt, 'MM/dd HH:mm')}"></time>
                </div>
                <p class="mb-1 small text-primary fw-medium" th:text="${n.course.name}">コース</p>
                <p class="mb-0 small text-muted" th:text="${n.content}">内容</p>
            </li>
        </ul>
        </div>
    </section>

    <!-- ① 担当コースを最上部に（スクロール不要で機能にアクセス） -->
    <h2 class="h5 fw-bold mb-3" th:unless="${courseList.empty}">担当コース・機能メニュー</h2>
    <div class="row g-4 mb-4" th:unless="${courseList.empty}">
        <div class="col-12 col-lg-6" th:each="course : ${courseList}">
            <div class="card pcfa-course-card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${course.name}">コース名</h5>
                    <span th:if="${chatUnreadMap != null and chatUnreadMap[course.id] != null}"
                          class="badge text-bg-danger"
                          th:text="'未読 ' + ${chatUnreadMap[course.id]}"></span>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-0" th:text="${course.description} ?: '（説明なし）'"></p>
                </div>
                <div class="card-footer border-0 pt-0 pb-3 px-3">
                    <div class="row g-2 pcfa-action-grid">
                        <div class="col-6"><a th:href="@{/instructor/materials(courseId=${course.id})}" class="btn btn-outline-primary pcfa-course-action w-100">教材管理</a></div>
                        <div class="col-6"><a th:href="@{/instructor/assignments(courseId=${course.id})}" class="btn btn-outline-warning pcfa-course-action w-100">課題管理</a></div>
                        <div class="col-6"><a th:href="@{/instructor/submissions(courseId=${course.id})}" class="btn btn-outline-success pcfa-course-action w-100">提出確認</a></div>
                        <div class="col-6"><a th:href="@{/instructor/attendance(courseId=${course.id})}" class="btn btn-outline-secondary pcfa-course-action w-100">出欠確認</a></div>
                        <div class="col-6"><a th:href="@{/instructor/students(courseId=${course.id})}" class="btn btn-outline-dark pcfa-course-action w-100">受講者一覧</a></div>
                        <div class="col-6"><a th:href="@{/instructor/announcements(courseId=${course.id})}" class="btn btn-outline-danger pcfa-course-action w-100">お知らせ</a></div>
                        <div class="col-12">
                            <a th:href="@{/chat(courseId=${course.id})}" class="btn btn-primary pcfa-course-action w-100 position-relative">
                                <i class="bi bi-chat-dots me-1"></i>チャットルーム
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ② カレンダー + 近日の授業（コンパクト） -->
    <div class="row g-3" th:unless="${courseList.empty}">
        <div class="col-lg-8">
            <section class="panel h-100 mb-0">
                <div class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h2 class="h6 mb-0 section-title"><i class="bi bi-calendar3"></i><span>授業カレンダー</span></h2>
                    <div class="d-flex align-items-center gap-2">
                        <a th:href="@{/instructor/home(year=${calPrevYear}, month=${calPrevMonth})}"
                           class="btn btn-sm btn-light pcfa-cal-nav" title="前月">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                        <span class="fw-semibold small px-1" th:text="${calMonthLabel}"></span>
                        <a th:href="@{/instructor/home(year=${calNextYear}, month=${calNextMonth})}"
                           class="btn btn-sm btn-light pcfa-cal-nav" title="翌月">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                        <a th:href="@{/instructor/home}" class="btn btn-sm btn-outline-primary">今月</a>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="pcfa-cal-weekdays">
                        <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-muted">土</span><span class="text-muted">日</span>
                    </div>
                    <div class="pcfa-cal-grid" th:if="${calendarCells != null}">
                        <div th:each="cell : ${calendarCells}"
                             th:class="|pcfa-cal-cell${!cell.inCurrentMonth ? ' other-month' : ''}${cell.inCurrentMonth and !cell.lessons.isEmpty() and cell.lessons[0].timing == 'today' ? ' is-today' : ''}${cell.inCurrentMonth and !cell.lessons.isEmpty() and cell.lessons[0].timing == 'upcoming' ? ' has-upcoming' : ''}${cell.inCurrentMonth and !cell.lessons.isEmpty() and cell.lessons[0].timing == 'past' ? ' has-past' : ''}|">
                            <span class="pcfa-cal-day" th:text="${cell.date.dayOfMonth}"></span>
                            <div th:each="les : ${cell.lessons}" class="pcfa-cal-event"
                                 th:title="${les.courseName}"
                                 th:text="${les.startTime != null ? #temporals.format(les.startTime,'HH:mm') : '授業'}"></div>
                        </div>
                    </div>
                    <div class="pcfa-cal-legend mt-3">
                        <span><i class="pcfa-legend-dot today"></i>本日</span>
                        <span><i class="pcfa-legend-dot upcoming"></i>予定</span>
                        <span><i class="pcfa-legend-dot past"></i>終了</span>
                    </div>
                </div>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="panel h-100 mb-0">
                <div class="panel-header"><h2 class="h6 mb-0">近日の授業（最大5件）</h2></div>
                <ul class="list-group list-group-flush" th:if="${nearTermRows != null and !nearTermRows.empty}">
                    <li class="list-group-item" th:each="row : ${nearTermRows}">
                        <div class="fw-semibold small" th:text="${row.lessonDate}"></div>
                        <div class="text-muted small" th:text="${row.courseName}"></div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <span class="small">
                                <span th:if="${row.startTime != null}" th:text="${#temporals.format(row.startTime,'HH:mm')}"></span>
                                <span th:if="${row.endTime != null}" th:text="'〜' + ${#temporals.format(row.endTime,'HH:mm')}"></span>
                            </span>
                            <a th:href="@{/instructor/attendance(courseId=${row.courseId})}" class="btn btn-sm btn-light">出欠</a>
                        </div>
                    </li>
                </ul>
                <div class="panel-body text-muted small text-center py-4" th:if="${nearTermRows == null or nearTermRows.empty}">
                    今後の授業予定はありません
                </div>
            </section>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
