<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>コース詳細 | PCFA受講管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">

<nav class="navbar navbar-dark pcfa-navbar">
    <a class="navbar-brand" href="/student/home">← ホームへ戻る</a>
    <span class="text-white small fw-bold">コース詳細</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container py-4" style="max-width: 960px;">
    <div class="card pcfa-course-card mb-4">
        <div class="card-header" th:text="${course.name}">コース名</div>
        <div class="card-body">
            <h5 class="fw-bold mb-3">課題一覧</h5>
            <table class="table table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th>課題名</th>
                    <th>提出期限</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assignment : ${assignmentList}">
                    <td th:text="${assignment.title}"></td>
                    <td th:text="${#temporals.format(assignment.deadline, 'yyyy/MM/dd HH:mm')}"></td>
                </tr>
                </tbody>
            </table>

            <h5 class="fw-bold mt-4 mb-3">教材一覧</h5>
            <table class="table table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th>教材名</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="material : ${materialList}">
                    <td th:text="${material.title}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
