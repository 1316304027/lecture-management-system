<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>コース詳細 | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/student/home}"><i class="bi bi-arrow-left"></i> ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-journal-bookmark"></i></span>
            <div>
                <p class="eyebrow mb-1">Course Detail</p>
                <h1 class="h3 mb-1" th:text="${course.name}">コース名</h1>
            </div>
        </div>
    </div>

    <section class="panel mb-3">
        <div class="panel-header">
            <h2 class="h6 mb-0 section-title"><i class="bi bi-journal-text"></i><span>課題一覧</span></h2>
        </div>
        <div class="table-responsive">
            <table class="table table-hover pcfa-portal-table align-middle mb-0">
                <thead>
                <tr>
                    <th>課題名</th>
                    <th>提出期限</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="assignment : ${assignmentList}">
                    <td th:text="${assignment.title}"></td>
                    <td th:text="${#temporals.format(assignment.deadline, 'yyyy/MM/dd HH:mm')}"></td>
                </tr>
                <tr th:if="${assignmentList.empty}">
                    <td colspan="2" class="text-muted text-center py-3">課題はありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="panel mb-0">
        <div class="panel-header">
            <h2 class="h6 mb-0 section-title"><i class="bi bi-file-earmark-pdf"></i><span>教材一覧</span></h2>
        </div>
        <div class="table-responsive">
            <table class="table table-hover pcfa-portal-table align-middle mb-0">
                <thead>
                <tr><th>教材名</th></tr>
                </thead>
                <tbody>
                <tr th:each="material : ${materialList}">
                    <td th:text="${material.title}"></td>
                </tr>
                <tr th:if="${materialList.empty}">
                    <td class="text-muted text-center py-3">教材はありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
