<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>教材一覧</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/student/home}"><i class="bi bi-arrow-left"></i> ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-file-earmark-pdf"></i></span>
            <div>
                <p class="eyebrow mb-1">Materials</p>
                <h1 class="h3 mb-1">教材一覧</h1>
                <p class="text-muted mb-0" th:text="${course.name}"></p>
            </div>
        </div>
    </div>

    <section class="panel mb-0">
        <div class="panel-header">
            <h2 class="h6 mb-0 section-title"><i class="bi bi-collection"></i><span>公開教材</span></h2>
        </div>
        <div class="table-responsive">
            <table class="table table-hover pcfa-portal-table align-middle mb-0">
                <thead>
                <tr>
                    <th>教材タイトル</th>
                    <th style="width:180px">ダウンロード</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${materialList}">
                    <td class="fw-semibold" th:text="${m.title}"></td>
                    <td>
                        <a th:href="@{/student/materials/{id}/download(id=${m.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-download me-1"></i>PDF
                        </a>
                    </td>
                </tr>
                <tr th:if="${materialList.empty}">
                    <td colspan="2" class="text-muted text-center py-4">公開中の教材はありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
