<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>受講者プロフィール</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="${returnUrl}">
        <i class="bi bi-arrow-left"></i> <span th:text="${returnLabel}">戻る</span>
    </a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-person-circle"></i></span>
            <div>
                <p class="eyebrow mb-1">Student Profile</p>
                <h1 class="h3 mb-1">受講者プロフィール</h1>
                <p class="text-muted mb-0">閲覧専用 — 編集は管理者がユーザー管理で行います</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/profile-card :: card(${user}, ${avatarUrl}, ${courseList}, false)}"></div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
