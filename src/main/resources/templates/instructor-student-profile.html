<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>受講者プロフィール</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-3">
    <a class="navbar-brand" th:href="${returnUrl}">← <span th:text="${returnLabel}">出欠確認</span></a>
    <span class="text-white small">受講者プロフィール</span>
</nav>
<div class="container py-4" style="max-width: 640px;">
    <div class="alert alert-light border small mb-3">
        <strong>閲覧専用</strong> — 講師は受講者情報の確認のみ可能です。編集・パスワード操作は管理者がユーザー管理で行います。
    </div>
    <div th:replace="~{fragments/profile-card :: card(${user}, ${avatarUrl}, ${courseList}, false)}"></div>
</div>
</body>
</html>
