<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/adminhmd-layout :: layout(~{::title}, 'chat', ~{::main}, ~{::extraHead}, ~{::extraScripts}, true)}">
<head>
    <title>チャット</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="pcfa-split-page">
        <aside class="pcfa-split-sidebar">
            <div class="pcfa-sidebar-panel">
                <div class="pcfa-sidebar-panel-header"><i class="bi bi-chat-dots me-1"></i> コース選択</div>
                <div class="pcfa-sidebar-panel-body">
                    <input type="text" class="form-control form-control-sm search-input mb-2"
                           placeholder="コース名で検索…" oninput="filterChatCourses(this.value)">
                    <nav class="pcfa-nav-list" id="chatCourseList">
                        <a th:each="c : ${courseList}"
                           th:href="@{/admin/chat(courseId=${c.id})}"
                           th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
                           th:attr="data-name=${c.name}" th:text="${c.name}"></a>
                    </nav>
                </div>
            </div>
            <p class="small text-muted mb-0 px-1">コース単位で講師・受講者と会話できます。不適切な投稿は削除可能です。</p>
        </aside>

        <div class="pcfa-split-main">
            <div class="pcfa-split-main-inner">

                <div th:unless="${selectedCourse != null}" class="panel">
                    <div class="panel-body text-center py-5 text-muted">
                        <i class="bi bi-chat-dots display-4 d-block mb-3 opacity-50"></i>
                        <p class="mb-0 fw-semibold">← 左のコースを選択してください</p>
                    </div>
                </div>

                <th:block th:if="${selectedCourse != null}">
                    <div class="page-heading mb-3">
                        <div class="page-heading-copy">
                            <span class="page-icon"><i class="bi bi-chat-dots"></i></span>
                            <div>
                                <p class="eyebrow mb-1">Course Chat</p>
                                <h1 class="h3 mb-1" th:text="${selectedCourse.name}">コース</h1>
                                <p class="text-muted mb-0">講師・受講者と同じルームでやり取り（管理者として参加）</p>
                            </div>
                        </div>
                    </div>

                    <div th:replace="~{fragments/pcfa-chat-room :: chatRoom(${messages}, ${loginUser}, ${selectedCourse.id}, @{/admin/chat/send}, true)}"></div>
                </th:block>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts">
<script>
function filterChatCourses(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#chatCourseList a[data-name]').forEach(el => {
        el.style.display = (el.dataset.name || '').toLowerCase().includes(q) ? '' : 'none';
    });
}
</script>
</th:block>
</body>
</html>
