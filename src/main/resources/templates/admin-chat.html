<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/adminhmd-layout :: layout(~{::title}, 'chat', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>全チャット閲覧</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="page-heading mb-4">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-chat-dots" aria-hidden="true"></i></span>
            <div>
                <p class="eyebrow mb-1">Chat Monitor</p>
                <h1 class="h3 mb-1">全チャット閲覧</h1>
                <p class="text-muted mb-0">全コースのチャットメッセージを新しい順に確認できます。</p>
            </div>
        </div>
    </div>

    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header d-flex justify-content-between align-items-center">
            <span>全コースのチャットメッセージ（新しい順）</span>
            <span class="badge bg-light text-dark" th:text="${messages.size()} + ' 件'"></span>
        </div>
        <div class="pcfa-admin-section-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width:140px">送信日時</th>
                        <th style="width:80px">ロール</th>
                        <th style="width:130px">送信者</th>
                        <th style="width:150px">コース</th>
                        <th>メッセージ</th>
                        <!-- 管理者のみ削除ボタン列を表示 -->
                        <th style="width:80px" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="msg : ${messages}">
                        <td class="small"
                            th:text="${#temporals.format(msg.sentAt, 'yyyy/MM/dd HH:mm')}">
                        </td>
                        <td>
                            <span class="badge text-white"
                                  th:classappend="${msg.sender.role == 'ADMIN'} ? 'role-admin' :
                                                  (${msg.sender.role == 'INSTRUCTOR'} ? 'role-instructor' : 'role-student')"
                                  th:text="${msg.sender.role == 'ADMIN'} ? '管理者' :
                                           (${msg.sender.role == 'INSTRUCTOR'} ? '教師' : '学生')">
                            </span>
                        </td>
                        <td th:text="${msg.sender.name}"></td>
                        <td class="small" th:text="${msg.course.name}"></td>
                        <td>
                            <!-- 改行を保持して表示 -->
                            <span class="msg-content"
                                  th:text="${msg.content}"></span>
                        </td>
                        <td class="text-center">
                            <!--
                                管理者のみ削除ボタンを表示
                                confirmで確認ダイアログを表示してから削除
                            -->
                            <form th:action="@{/admin/chat/delete/{id}(id=${msg.id})}"
                                  method="post"
                                  onsubmit="return confirm('このメッセージを削除しますか？')">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    🗑️
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${messages.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            チャットメッセージはありません
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="px-3 py-2 border-top text-muted small">
            合計 <strong th:text="${messages.size()}"></strong> 件 ／
            管理者のみメッセージを削除できます
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
