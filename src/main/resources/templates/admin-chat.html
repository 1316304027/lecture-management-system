<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/adminhmd-layout :: layout(~{::title}, 'chat', ~{::main}, ~{::extraHead}, ~{::extraScripts}, true)}">
<head>
    <title>チャット閲覧</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="pcfa-split-page">
        <aside class="pcfa-split-sidebar">
            <div class="pcfa-sidebar-panel">
                <div class="pcfa-sidebar-panel-header"><i class="bi bi-chat-dots me-1"></i> コース選択</div>
                <div class="pcfa-sidebar-panel-body">
                    <input type="text" class="form-control form-control-sm search-input mb-2"
                           placeholder="コース名で検索…" oninput="filterChatCourses(this.value)">
                    <nav class="pcfa-nav-list" id="chatCourseList">
                        <a th:each="c : ${courseList}"
                           th:href="@{/admin/chat(courseId=${c.id})}"
                           th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
                           th:attr="data-name=${c.name}" th:text="${c.name}"></a>
                    </nav>
                </div>
            </div>
            <p class="small text-muted mb-0 px-1">コースごとにチャットを分けて閲覧します（発表・運用向け）。</p>
        </aside>

        <div class="pcfa-split-main">
            <div class="pcfa-split-main-inner">

                <div th:unless="${selectedCourse != null}" class="panel">
                    <div class="panel-body text-center py-5 text-muted">
                        <i class="bi bi-chat-dots display-4 d-block mb-3 opacity-50"></i>
                        <p class="mb-0 fw-semibold">← 左のコースを選択してください</p>
                        <p class="small mb-0 mt-2">全コース混在ではなく、コース単位で確認するのが企業システムの標準です。</p>
                    </div>
                </div>

                <th:block th:if="${selectedCourse != null}">
                    <div class="page-heading mb-3">
                        <div class="page-heading-copy">
                            <span class="page-icon"><i class="bi bi-chat-dots"></i></span>
                            <div>
                                <p class="eyebrow mb-1">Chat Monitor</p>
                                <h1 class="h3 mb-1" th:text="${selectedCourse.name}">コース</h1>
                                <p class="text-muted mb-0">このコースのチャットのみ表示（新しい順）</p>
                            </div>
                        </div>
                        <div class="heading-actions">
                            <span class="badge text-bg-light" th:text="${messages.size()} + ' 件'"></span>
                        </div>
                    </div>

                    <section class="panel mb-0">
                        <div class="panel-header">
                            <h2 class="h6 mb-0 section-title"><i class="bi bi-table"></i><span>メッセージ一覧</span></h2>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                <tr>
                                    <th style="width:140px">送信日時</th>
                                    <th style="width:88px">ロール</th>
                                    <th style="width:120px">送信者</th>
                                    <th>メッセージ</th>
                                    <th style="width:72px" class="text-center">操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="msg : ${messages}">
                                    <td class="small" th:text="${#temporals.format(msg.sentAt, 'yyyy/MM/dd HH:mm')}"></td>
                                    <td>
                                        <span class="badge text-white"
                                              th:classappend="${msg.sender.role == 'ADMIN'} ? 'role-admin' :
                                                              (${msg.sender.role == 'INSTRUCTOR'} ? 'role-instructor' : 'role-student')"
                                              th:text="${msg.sender.role == 'ADMIN'} ? '管理者' :
                                                       (${msg.sender.role == 'INSTRUCTOR'} ? '講師' : '受講者')"></span>
                                    </td>
                                    <td th:text="${msg.sender.name}"></td>
                                    <td><span class="msg-content" th:text="${msg.content}"></span></td>
                                    <td class="text-center">
                                        <form th:action="@{/admin/chat/delete/{id}(id=${msg.id})}" method="post"
                                              onsubmit="return confirm('このメッセージを削除しますか？')">
                                            <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="削除">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${messages.empty}">
                                    <td colspan="5" class="text-center text-muted py-4">このコースにはメッセージがありません</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </th:block>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts">
<script>
function filterChatCourses(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#chatCourseList a[data-name]').forEach(el => {
        el.style.display = (el.dataset.name || '').toLowerCase().includes(q) ? '' : 'none';
    });
}
</script>
</th:block>
</body>
</html>
