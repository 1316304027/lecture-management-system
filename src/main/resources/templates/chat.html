<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チャット</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }

        .chat-container {
            max-width: 800px;
            margin: 20px auto;
        }

        .chat-box {
            height: 500px;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #dee2e6;
        }

        /* 自分のメッセージ（右側） */
        .message-mine {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .message-mine .bubble {
            background: #0d6efd;
            color: white;
            /* 【修正】min-widthとword-breakを追加 */
            border-radius: 18px 18px 4px 18px;
            padding: 10px 16px;
            max-width: 65%;
            min-width: 60px;          /* 最小幅を確保 */
            word-break: break-word;   /* 長い単語を折り返す */
            word-wrap: break-word;
            white-space: pre-wrap;    /* 改行を保持 */
            display: inline-block;    /* インラインブロックで幅を確保 */
        }

        /* 相手のメッセージ（左側） */
        .message-other {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 14px;
        }

        .message-other .bubble {
            background: #e9ecef;
            color: #212529;
            border-radius: 18px 18px 18px 4px;
            padding: 10px 16px;
            max-width: 65%;
            min-width: 60px;          /* 最小幅を確保 */
            word-break: break-word;   /* 長い単語を折り返す */
            word-wrap: break-word;
            white-space: pre-wrap;    /* 改行を保持 */
            display: inline-block;    /* インラインブロックで幅を確保 */
        }

        .msg-meta {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 4px;
        }

        /* 送信フォームのスタイル */
        .chat-input-area {
            padding: 12px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand"
       th:href="${loginUser.role == 'STUDENT'} ? '/student/home' : '/instructor/home'">
        ← ホームへ戻る
    </a>
    <span class="text-white fw-bold"
          th:text="'💬 チャット - ' + ${course.name}"></span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="chat-container">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between">
            <span>💬 <span th:text="${course.name}"></span> のチャット</span>
            <small class="opacity-75">メッセージは500文字以内</small>
        </div>

        <!-- メッセージ一覧 -->
        <div class="chat-box" id="chatBox">
            <div th:each="msg : ${messages}">

                <!-- 自分のメッセージ（右側・青） -->
                <div th:if="${msg.sender.id == loginUser.id}"
                     class="message-mine">
                    <div>
                        <div class="msg-meta text-end">
                            <span th:text="${#temporals.format(msg.sentAt, 'MM/dd HH:mm')}"></span>
                        </div>
                        <div class="bubble" th:text="${msg.content}"></div>
                    </div>
                </div>

                <!-- 相手のメッセージ（左側・グレー） -->
                <div th:unless="${msg.sender.id == loginUser.id}"
                     class="message-other">
                    <div>
                        <div class="msg-meta">
                            <span th:if="${msg.sender.role == 'STUDENT'}"
                                  class="badge bg-info text-dark me-1">学生</span>
                            <span th:if="${msg.sender.role == 'INSTRUCTOR'}"
                                  class="badge bg-success me-1">教師</span>
                            <span th:if="${msg.sender.role == 'ADMIN'}"
                                  class="badge bg-danger me-1">管理者</span>
                            <strong th:text="${msg.sender.name}"></strong>
                            <span class="ms-2"
                                  th:text="${#temporals.format(msg.sentAt, 'MM/dd HH:mm')}"></span>
                        </div>
                        <div class="bubble" th:text="${msg.content}"></div>
                    </div>
                </div>

            </div>

            <!-- メッセージなしの場合 -->
            <div th:if="${messages.empty}"
                 class="text-center text-muted py-5">
                <div class="fs-1">💬</div>
                <p>まだメッセージはありません。<br>最初のメッセージを送りましょう！</p>
            </div>
        </div>

        <!-- 送信フォーム -->
        <div class="chat-input-area">
            <form th:action="@{/chat/send}" method="post"
                  class="d-flex gap-2">
                <input type="hidden" name="courseId" th:value="${courseId}">
                <input type="text"
                       name="content"
                       class="form-control"
                       placeholder="メッセージを入力... （最大500文字）"
                       maxlength="500"
                       required
                       autocomplete="off">
                <button type="submit"
                        class="btn btn-primary px-4 text-nowrap">
                    送信
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // ページ読み込み時に最新メッセージまでスクロール
    window.onload = function() {
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    };
</script>
</body>
</html>
