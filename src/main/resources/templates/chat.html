<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, ${loginUser.role == 'INSTRUCTOR'} ? 'instructor' : 'student', 'chat', ~{::main}, ~{::extraHead}, ~{::extraScripts}, true)}">
<head>
    <title>チャット</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="pcfa-chat-fluid">
        <header class="pcfa-chat-topbar">
            <a class="pcfa-chat-back"
               th:href="${loginUser.role == 'INSTRUCTOR'} ? @{/instructor/home} : @{/student/home}"
               title="戻る">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div class="pcfa-chat-topbar-copy">
                <p class="pcfa-chat-topbar-eyebrow">Course Chat</p>
                <h1 class="pcfa-chat-topbar-title" th:text="${course.name}">コース</h1>
            </div>
        </header>
        <div th:replace="~{fragments/pcfa-chat-room :: chatRoom(${messages}, ${loginUser}, ${courseId}, '/chat/send', false)}"></div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
