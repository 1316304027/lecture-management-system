<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body pcfa-login-body">
<div class="container py-5" style="max-width: 480px;">
    <div class="card pcfa-login-card shadow">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold text-center mb-1">パスワード変更</h1>
            <p class="text-muted small text-center mb-4">
                初回ログインまたは管理者リセットのため、新しいパスワードを設定してください。
            </p>
            <div th:if="${errorMessage}" class="alert alert-danger small" th:text="${errorMessage}"></div>
            <form th:action="@{/change-password}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">新しいパスワード（8文字以上）</label>
                    <input type="password" name="newPassword" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">確認用パスワード</label>
                    <input type="password" name="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100 pcfa-btn-primary">パスワードを設定</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
