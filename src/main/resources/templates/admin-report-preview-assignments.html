<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>課題明細プレビュー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-3">
    <a class="navbar-brand" th:href="${returnUrl}">← 実績レポートに戻る</a>
    <span class="text-white small fw-bold">課題明細プレビュー</span>
</nav>
<div class="container py-4" style="max-width: 900px;">
    <div class="pcfa-page-header mb-3">
        <h1 class="h4 fw-bold mb-1" th:text="${student.name} + ' さんの課題一覧'"></h1>
        <p class="text-muted small mb-0">
            コース：<span th:text="${course.name}"></span> ／
            メール：<span th:text="${student.email}"></span>
        </p>
    </div>
    <div class="d-flex flex-wrap gap-2 justify-content-end mb-3">
        <a th:href="${returnUrl}" class="btn btn-outline-secondary btn-sm">戻る</a>
        <a th:href="@{/admin/reports/export(courseId=${course.id}, studentId=${student.id}, type='assignments')}"
           class="btn btn-success btn-sm">Excel用ファイルをダウンロード</a>
    </div>
    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header">公開課題ごとの提出・採点状況</div>
        <div class="pcfa-admin-section-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>課題名</th>
                    <th>提出期限</th>
                    <th>提出状態</th>
                    <th>スコア</th>
                    <th>提出日時</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td class="fw-semibold" th:text="${row.title}"></td>
                    <td th:text="${row.deadline != null ? #temporals.format(row.deadline, 'yyyy/MM/dd HH:mm') : '—'}"></td>
                    <td>
                        <span th:if="${row.status == '未提出'}" class="badge bg-warning text-dark">未提出</span>
                        <span th:if="${row.status == '提出済（採点待ち）'}" class="badge bg-secondary">採点待ち</span>
                        <span th:if="${row.status == '採点済'}" class="badge bg-success">採点済</span>
                    </td>
                    <td th:text="${row.score != null ? row.score + '点' : '—'}"></td>
                    <td>
                        <span th:if="${row.submittedAt != null}" th:text="${#temporals.format(row.submittedAt, 'yyyy/MM/dd HH:mm')}"></span>
                        <span th:if="${row.submittedAt == null}" class="text-muted">—</span>
                    </td>
                </tr>
                <tr th:if="${rows.empty}">
                    <td colspan="5" class="text-muted text-center py-4">公開課題がありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
