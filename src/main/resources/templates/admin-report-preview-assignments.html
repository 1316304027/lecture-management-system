<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/adminhmd-layout :: layout(~{::title}, 'reports', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>課題明細プレビュー</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="page-heading mb-4">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></span>
            <div>
                <p class="eyebrow mb-1">Assignment Detail</p>
                <h1 class="h3 mb-1" th:text="${student.name} + ' さんの課題一覧'"></h1>
                <p class="text-muted mb-0">
                    コース：<span th:text="${course.name}"></span> ／
                    メール：<span th:text="${student.email}"></span>
                </p>
            </div>
        </div>
        <div class="heading-actions">
            <a th:href="${returnUrl}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> 実績レポートに戻る
            </a>
            <a th:href="@{/admin/reports/export(courseId=${course.id}, studentId=${student.id}, type='assignments')}"
               class="btn btn-success btn-sm">
                <i class="bi bi-download"></i> Excel用ファイルをダウンロード
            </a>
        </div>
    </div>

    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header">公開課題ごとの提出・採点状況</div>
        <div class="pcfa-admin-section-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>課題名</th>
                    <th>提出期限</th>
                    <th>提出状態</th>
                    <th>スコア</th>
                    <th>提出日時</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td class="fw-semibold" th:text="${row.title}"></td>
                    <td th:text="${row.deadline != null ? #temporals.format(row.deadline, 'yyyy/MM/dd HH:mm') : '—'}"></td>
                    <td>
                        <span th:if="${row.status == '未提出'}" class="badge bg-warning text-dark">未提出</span>
                        <span th:if="${row.status == '提出済（採点待ち）'}" class="badge bg-secondary">採点待ち</span>
                        <span th:if="${row.status == '採点済'}" class="badge bg-success">採点済</span>
                    </td>
                    <td th:text="${row.score != null ? row.score + '点' : '—'}"></td>
                    <td>
                        <span th:if="${row.submittedAt != null}" th:text="${#temporals.format(row.submittedAt, 'yyyy/MM/dd HH:mm')}"></span>
                        <span th:if="${row.submittedAt == null}" class="text-muted">—</span>
                    </td>
                </tr>
                <tr th:if="${rows.empty}">
                    <td colspan="5" class="text-muted text-center py-4">公開課題がありません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
