<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>受講者ホーム | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">

    <div class="page-heading mb-4">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-house-door" aria-hidden="true"></i></span>
            <div>
                <p class="eyebrow mb-1">Student Portal</p>
                <h1 class="h3 mb-1">受講者ホーム</h1>
                <p class="text-muted mb-0" th:text="'ようこそ、' + ${loginUser.name} + ' さん。'"></p>
            </div>
        </div>
        <div class="heading-actions">
            <a th:href="@{/student/profile}" class="btn btn-light btn-sm">
                <i class="bi bi-person-circle me-1"></i>プロフィール編集
            </a>
        </div>
    </div>

    <!-- Dashboard 統計 -->
    <section class="row g-3 mb-4" th:unless="${courseList.empty}" aria-label="サマリー">
        <div class="col-6 col-md-3">
            <article class="metric-card metric-primary h-100">
                <div class="metric-top">
                    <span class="metric-label">受講コース</span>
                    <span class="metric-icon"><i class="bi bi-journal-bookmark" aria-hidden="true"></i></span>
                </div>
                <div class="metric-value" th:text="${courseList.size()}">0</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-success h-100">
                <div class="metric-top">
                    <span class="metric-label">平均出席率</span>
                    <span class="metric-icon"><i class="bi bi-calendar-check" aria-hidden="true"></i></span>
                </div>
                <div class="metric-value" th:text="${avgAttendanceRate} + '%'">0%</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-warning h-100">
                <div class="metric-top">
                    <span class="metric-label">未提出課題</span>
                    <span class="metric-icon"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></span>
                </div>
                <div class="metric-value" th:text="${totalPendingAssignments}">0</div>
            </article>
        </div>
        <div class="col-6 col-md-3">
            <article class="metric-card metric-primary h-100">
                <div class="metric-top">
                    <span class="metric-label">未読チャット</span>
                    <span class="metric-icon"><i class="bi bi-chat-dots" aria-hidden="true"></i></span>
                </div>
                <div class="metric-value" th:text="${totalUnreadChat}">0</div>
            </article>
        </div>
    </section>

    <div class="pcfa-info-bar mb-4" th:unless="${courseList.empty}">
        <span class="pcfa-info-bar-label">クイックリンク</span>
        <a th:href="@{/student/profile}" class="btn btn-sm btn-outline-success ms-auto">プロフィール編集</a>
    </div>

    <div th:if="${courseList.empty}" class="pcfa-empty-state">
        <p class="text-muted mb-0">受講中のコースがありません。管理者にお問い合わせください。</p>
    </div>

    <h2 class="h5 fw-bold mb-3" th:unless="${courseList.empty}">受講コース一覧</h2>

    <div class="row g-4" th:unless="${courseList.empty}">
        <div class="col-12 col-md-6" th:each="course : ${courseList}">
            <div class="card pcfa-course-card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${course.name}">コース名</h5>
                    <a th:href="@{/student/course(courseId=${course.id})}"
                       class="btn btn-sm btn-light">コース詳細</a>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-2" th:text="${course.description} ?: '（説明なし）'"></p>
                    <div class="d-flex flex-wrap gap-2 small" th:if="${courseStatsMap[course.id] != null}">
                        <span class="badge bg-light text-dark border"
                              th:text="'出席率 ' + ${courseStatsMap[course.id].attendanceRate} + '%'"></span>
                        <span class="badge bg-warning text-dark"
                              th:if="${courseStatsMap[course.id].pendingAssignments > 0}"
                              th:text="'未提出 ' + ${courseStatsMap[course.id].pendingAssignments}"></span>
                        <span class="badge bg-info text-dark"
                              th:if="${courseStatsMap[course.id].announcementCount > 0}"
                              th:text="'お知らせ ' + ${courseStatsMap[course.id].announcementCount}"></span>
                    </div>
                </div>
                <div class="card-footer border-0 pt-0 pb-3 px-3">
                    <div class="row g-2 pcfa-action-grid">
                        <div class="col-6">
                            <a th:href="@{/student/attendance(courseId=${course.id})}"
                               class="btn btn-outline-primary pcfa-course-action w-100">出席登録</a>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/student/materials(courseId=${course.id})}"
                               class="btn btn-outline-secondary pcfa-course-action w-100">教材一覧</a>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/student/assignments(courseId=${course.id})}"
                               class="btn btn-outline-warning pcfa-course-action w-100">課題提出</a>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/chat(courseId=${course.id})}"
                               class="btn btn-outline-info pcfa-course-action w-100 position-relative">
                                チャット
                                <span th:if="${chatUnreadMap != null and chatUnreadMap[course.id] != null}"
                                      class="pcfa-chat-badge"
                                      th:text="${chatUnreadMap[course.id]}"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
