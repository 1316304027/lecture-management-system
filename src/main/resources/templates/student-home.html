<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>受講者ホーム | PCFA受講管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">

<nav class="navbar navbar-dark pcfa-navbar">
    <span class="navbar-brand mb-0">🏫 PCFA受講管理システム</span>
    <div class="d-flex align-items-center gap-2">
        <span class="text-white small" th:text="${loginUser.name} + ' さん'"></span>
        <form th:if="${isProxy}" action="/admin/restore-session" method="post" class="d-inline">
            <button type="submit" class="btn btn-warning btn-sm">管理者へ戻る</button>
        </form>
        <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
    </div>
</nav>

<div class="container py-4">

    <div class="pcfa-page-header">
        <h1>受講者ダッシュボード</h1>
        <p th:text="'ようこそ、' + ${loginUser.name} + ' さん。受講中のコースから機能を選んでください。'"></p>
    </div>

    <div class="row g-3 mb-4" th:unless="${courseList.empty}">
        <div class="col-md-4">
            <div class="pcfa-stat-card">
                <div class="stat-value" th:text="${courseList.size()}">0</div>
                <div class="stat-label">受講コース数</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="pcfa-stat-card" style="border-left-color: #0d6efd;">
                <div class="stat-value" style="color:#0d6efd;">📋</div>
                <div class="stat-label">出席登録</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="pcfa-stat-card" style="border-left-color: #fd7e14;">
                <div class="stat-value" style="color:#fd7e14;">📝</div>
                <div class="stat-label">課題提出</div>
            </div>
        </div>
    </div>

    <h5 class="fw-bold mb-3" th:unless="${courseList.empty}">📚 受講コース一覧</h5>

    <div th:if="${courseList.empty}" class="pcfa-empty-state">
        <div class="fs-1 mb-3">📭</div>
        <p class="text-muted mb-0">受講中のコースがありません。管理者にお問い合わせください。</p>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="course : ${courseList}">
            <div class="card pcfa-course-card">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${course.name}">コース名</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-0" th:text="${course.description} ?: '（説明なし）'"></p>
                </div>
                <div class="card-footer d-grid gap-2">
                    <div class="d-flex gap-2">
                        <a th:href="@{/student/attendance(courseId=${course.id})}"
                           class="btn btn-sm btn-outline-primary pcfa-action-btn flex-fill">📋 出席</a>
                        <a th:href="@{/student/materials(courseId=${course.id})}"
                           class="btn btn-sm btn-outline-secondary pcfa-action-btn flex-fill">📄 教材</a>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/student/assignments(courseId=${course.id})}"
                           class="btn btn-sm btn-outline-warning pcfa-action-btn flex-fill">📝 課題</a>
                        <a th:href="@{/chat(courseId=${course.id})}"
                           class="btn btn-sm btn-outline-info pcfa-action-btn flex-fill">💬 チャット</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
