<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'submissions', ~{::main}, ~{::extraHead}, ~{::extraScripts}, true)}">
<head>
    <title>提出物確認</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div class="pcfa-split-page pcfa-portal-split">
        <aside class="pcfa-split-sidebar pcfa-split-sidebar--narrow">
            <div class="pcfa-sidebar-panel">
                <div class="pcfa-sidebar-panel-header">
                    <i class="bi bi-journal-text me-1"></i> 課題選択
                </div>
                <div class="pcfa-sidebar-panel-body">
                    <input type="text" class="form-control form-control-sm search-input mb-2"
                           placeholder="課題名で検索…" oninput="filterAssignList(this.value)">
                    <nav class="pcfa-nav-list" id="assignList">
                        <a th:each="a : ${assignmentList}"
                           th:href="@{/instructor/submissions(courseId=${course.id}, assignmentId=${a.id})}"
                           th:classappend="${selectedAssignment != null and selectedAssignment.id == a.id} ? 'active' : ''"
                           th:attr="data-name=${a.title}">
                            <span class="d-block fw-semibold small" th:text="${a.title}"></span>
                            <span class="text-muted" style="font-size:0.72rem"
                                  th:text="'期限 ' + ${#temporals.format(a.deadline, 'MM/dd HH:mm')}"></span>
                        </a>
                    </nav>
                    <p th:if="${assignmentList.empty}" class="text-muted small mb-0 px-1">課題未登録</p>
                </div>
            </div>
            <a class="pcfa-back-link mt-2 px-1 d-inline-flex" th:href="@{/instructor/home}">
                <i class="bi bi-arrow-left"></i> 講師ホーム
            </a>
        </aside>

        <div class="pcfa-split-main">
            <div class="pcfa-split-main-inner">

                <div th:unless="${selectedAssignment != null}" class="panel">
                    <div class="panel-body text-center py-5 text-muted">
                        <i class="bi bi-journal-text display-4 d-block mb-3 opacity-50"></i>
                        <p class="mb-0 fw-semibold">← 左の課題を選択してください</p>
                        <p class="small mb-0 mt-1" th:text="${course.name}"></p>
                    </div>
                </div>

                <th:block th:if="${selectedAssignment != null}">
                    <div class="page-heading mb-3">
                        <div class="page-heading-copy">
                            <span class="page-icon"><i class="bi bi-inbox"></i></span>
                            <div>
                                <p class="eyebrow mb-1">Submissions</p>
                                <h1 class="h3 mb-1">提出物確認</h1>
                                <p class="text-muted mb-0">
                                    <span th:text="${selectedAssignment.title}"></span>
                                    <span class="mx-1">·</span>
                                    <span th:text="${course.name}"></span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <section class="panel mb-0">
                        <div class="panel-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h2 class="h6 mb-0 section-title">
                                <i class="bi bi-people"></i><span>受講者の提出状況</span>
                            </h2>
                            <span class="text-muted small">
                                <span class="score-high">80点以上</span> /
                                <span class="score-mid ms-1">60〜79点</span> /
                                <span class="score-low ms-1">60点未満</span>
                            </span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover pcfa-portal-table align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>受講者名</th>
                                    <th style="width:140px">提出日時</th>
                                    <th class="text-center" style="width:90px">ファイル</th>
                                    <th class="text-center" style="width:80px">スコア</th>
                                    <th>評価コメント</th>
                                    <th style="min-width:280px">評価入力</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${submissionList}">
                                    <td>
                                        <span class="fw-semibold" th:text="${s.student.name}"></span>
                                        <span th:if="${s.score != null}" class="badge text-bg-success ms-1 small">評価済み</span>
                                    </td>
                                    <td class="small" th:text="${#temporals.format(s.submittedAt, 'yyyy/MM/dd HH:mm')}"></td>
                                    <td class="text-center">
                                        <a th:href="@{/instructor/submissions/{id}/download(id=${s.id})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-download"></i>
                                        </a>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${s.score != null}">
                                            <span th:if="${s.score >= 80}" class="score-high" th:text="${s.score} + '点'"></span>
                                            <span th:if="${s.score >= 60 and s.score < 80}" class="score-mid" th:text="${s.score} + '点'"></span>
                                            <span th:if="${s.score < 60}" class="score-low" th:text="${s.score} + '点'"></span>
                                        </span>
                                        <span th:unless="${s.score != null}" class="text-muted small">未採点</span>
                                    </td>
                                    <td class="small">
                                        <span th:if="${s.evaluationComment != null}" class="text-success" th:text="${s.evaluationComment}"></span>
                                        <span th:unless="${s.evaluationComment != null}" class="text-muted">―</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/instructor/submissions/{id}/evaluate(id=${s.id})}" method="post">
                                            <input type="hidden" name="courseId" th:value="${course.id}">
                                            <input type="hidden" name="assignmentId" th:value="${selectedAssignment.id}">
                                            <div class="input-group input-group-sm mb-1">
                                                <span class="input-group-text">点数</span>
                                                <input type="number" name="score" class="form-control"
                                                       th:value="${s.score}" min="0" max="100" placeholder="0〜100">
                                                <span class="input-group-text">点</span>
                                            </div>
                                            <div class="input-group input-group-sm">
                                                <input type="text" name="comment" class="form-control"
                                                       th:value="${s.evaluationComment}"
                                                       placeholder="評価コメント" maxlength="500">
                                                <button type="submit" class="btn btn-primary btn-sm">
                                                    <i class="bi bi-check-lg"></i> 保存
                                                </button>
                                            </div>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:each="u : ${studentList}"
                                    th:unless="${submissionList.?[student.id == __${u.id}__].size() > 0}"
                                    class="table-light">
                                    <td th:text="${u.name}" class="text-muted"></td>
                                    <td colspan="4" class="text-muted small">未提出</td>
                                    <td><span class="badge text-bg-secondary">未提出</span></td>
                                </tr>
                                <tr th:if="${submissionList.empty and studentList.empty}">
                                    <td colspan="6" class="text-muted text-center py-4">提出データがありません</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </th:block>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts">
<script>
function filterAssignList(q) {
    var term = (q || '').toLowerCase();
    document.querySelectorAll('#assignList a').forEach(function(a) {
        var name = (a.getAttribute('data-name') || '').toLowerCase();
        a.style.display = !term || name.includes(term) ? '' : 'none';
    });
}
</script>
</th:block>
</body>
</html>
