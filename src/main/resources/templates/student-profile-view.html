<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'profile', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>プロフィール | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/student/home}"><i class="bi bi-arrow-left"></i> ホームへ戻る</a>

    <div th:replace="~{fragments/profile-card :: card(${user}, ${avatarUrl}, ${courseList}, false)}"></div>
    <div class="text-center mt-3">
        <a th:href="@{/student/profile}" class="btn btn-primary pcfa-btn-primary">編集する</a>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
