<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>実績レポート</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
    <style>
        .rate-high { color: #198754; font-weight: 600; }
        .rate-mid  { color: #fd7e14; font-weight: 600; }
        .rate-low  { color: #dc3545; font-weight: 600; }
        .score-high { color: #198754; font-weight: 600; }
        .score-mid  { color: #fd7e14; font-weight: 600; }
        .score-low  { color: #dc3545; font-weight: 600; }
        .sidebar { min-height: calc(100vh - 58px); background: #fff; border-right: 1px solid #e2e8f0; }
    </style>
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-4 shadow-sm">
    <a class="navbar-brand" href="/admin/home">← 管理者ホーム</a>
    <span class="text-white fw-bold">実績レポート</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container-fluid p-0">
<div class="row g-0">

    <div class="col-md-2 sidebar p-3">
        <p class="text-muted fw-bold small mb-2 border-bottom pb-1">コース選択</p>
        <div class="list-group list-group-flush">
            <a th:each="c : ${courseList}"
               th:href="@{/admin/reports(courseId=${c.id})}"
               class="list-group-item list-group-item-action py-2 px-2 small"
               th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
               th:text="${c.name}"></a>
            <span th:if="${courseList.empty}" class="text-muted small">コースなし</span>
        </div>
    </div>

    <div class="col p-4" th:if="${selectedCourse != null}">
        <div class="pcfa-page-header mb-3">
            <h1 class="h4 fw-bold mb-1" th:text="'実績レポート：' + ${selectedCourse.name}"></h1>
            <p class="text-muted small mb-0">受講者ごとの出席・提出・採点状況を一覧表示します。</p>
        </div>

        <div class="pcfa-report-summary" th:unless="${reportList.empty}">
            <div class="pcfa-report-stat">
                <div class="val" th:text="${reportList.size()}">0</div>
                <div class="lbl">受講者数</div>
            </div>
            <div class="pcfa-report-stat">
                <div class="val" th:text="${reportList[0].totalAssignments}">0</div>
                <div class="lbl">公開課題数</div>
            </div>
            <div class="pcfa-report-stat">
                <div class="val" th:text="${reportList[0].totalLessons}">0</div>
                <div class="lbl">実施済み授業</div>
            </div>
        </div>

        <div class="card pcfa-course-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>氏名</th>
                                <th>メール</th>
                                <th class="text-center">出席</th>
                                <th class="text-center">出席率</th>
                                <th class="text-center">提出</th>
                                <th class="text-center">未提出</th>
                                <th class="text-center">採点済</th>
                                <th class="text-center">採点待ち</th>
                                <th class="text-center">平均スコア</th>
                                <th class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reportList}">
                                <td class="fw-semibold" th:text="${r.studentName}"></td>
                                <td class="small text-muted" th:text="${r.studentEmail}"></td>
                                <td class="text-center small">
                                    <span th:text="${r.attendedCount}"></span>/<span th:text="${r.totalLessons}"></span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${r.totalLessons == 0}" class="text-muted">―</span>
                                    <span th:if="${r.totalLessons > 0 and r.attendanceRate >= 80}"
                                          class="rate-high" th:text="${r.attendanceRate} + '%'"></span>
                                    <span th:if="${r.totalLessons > 0 and r.attendanceRate >= 70 and r.attendanceRate < 80}"
                                          class="rate-mid" th:text="${r.attendanceRate} + '%'"></span>
                                    <span th:if="${r.totalLessons > 0 and r.attendanceRate < 70}"
                                          class="rate-low" th:text="${r.attendanceRate} + '%'"></span>
                                </td>
                                <td class="text-center">
                                    <span th:text="${r.submittedCount}"></span>/<span th:text="${r.totalAssignments}"></span>
                                    <div class="small text-muted" th:text="${r.submissionRate} + '%'"></div>
                                </td>
                                <td class="text-center">
                                    <span th:text="${r.unsubmittedCount}"></span>
                                    <span th:if="${r.unsubmittedCount > 0}" class="badge bg-warning text-dark ms-1">!</span>
                                </td>
                                <td class="text-center" th:text="${r.evaluatedCount}"></td>
                                <td class="text-center">
                                    <span th:text="${r.pendingGradeCount}"></span>
                                    <span th:if="${r.pendingGradeCount > 0}" class="badge bg-info text-dark ms-1">待ち</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${r.averageScore == null}" class="badge bg-secondary">採点待ち</span>
                                    <span th:if="${r.averageScore != null and r.averageScore >= 80}"
                                          class="score-high" th:text="${r.averageScore} + '点'"></span>
                                    <span th:if="${r.averageScore != null and r.averageScore >= 60 and r.averageScore < 80}"
                                          class="score-mid" th:text="${r.averageScore} + '点'"></span>
                                    <span th:if="${r.averageScore != null and r.averageScore < 60}"
                                          class="score-low" th:text="${r.averageScore} + '点'"></span>
                                </td>
                                <td class="text-center text-nowrap">
                                    <a th:href="@{/admin/accounts/{id}/profile(id=${r.studentId})}"
                                       class="btn btn-sm btn-outline-primary">プロフィール</a>
                                </td>
                            </tr>
                            <tr th:if="${reportList.empty}">
                                <td colspan="10" class="text-muted text-center py-4">受講者が登録されていません</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card border-0 mt-3" style="background:#f8fafb;">
            <div class="card-body py-2 px-3 small">
                <strong>凡例：</strong>
                平均スコアは<strong>採点済み提出のみ</strong>の平均です。提出したが講師が未採点の場合は「採点待ち」と表示し、0点にはしません。
            </div>
        </div>
    </div>

    <div class="col d-flex align-items-center justify-content-center text-muted"
         th:unless="${selectedCourse != null}">
        <div class="text-center py-5">
            <p class="mb-0">← コースを選択してレポートを表示</p>
        </div>
    </div>

</div>
</div>
</body>
</html>
