<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'student', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>コースポータル | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/student/home}"><i class="bi bi-arrow-left"></i> ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-mortarboard"></i></span>
            <div>
                <p class="eyebrow mb-1">Course Portal</p>
                <h1 class="h3 mb-1" th:text="${course.name}"></h1>
                <p class="text-muted mb-0" th:text="${course.description} ?: '（説明なし）'"></p>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4" th:if="${courseStats != null}">
        <div class="col-4">
            <article class="metric-card metric-primary h-100">
                <div class="metric-top"><span class="metric-label">出席率</span></div>
                <div class="metric-value" th:text="${courseStats.attendanceRate} + '%'">0%</div>
            </article>
        </div>
        <div class="col-4">
            <article class="metric-card metric-warning h-100">
                <div class="metric-top"><span class="metric-label">未提出課題</span></div>
                <div class="metric-value" th:text="${courseStats.pendingAssignments}">0</div>
            </article>
        </div>
        <div class="col-4">
            <article class="metric-card metric-danger h-100">
                <div class="metric-top"><span class="metric-label">未読チャット</span></div>
                <div class="metric-value" th:text="${chatUnread}">0</div>
            </article>
        </div>
    </div>

    <div class="row g-2 mb-4 pcfa-action-grid">
        <div class="col-6 col-md-3">
            <a th:href="@{/student/attendance(courseId=${course.id})}"
               class="btn btn-outline-primary pcfa-course-action w-100">出席登録</a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/student/materials(courseId=${course.id})}"
               class="btn btn-outline-secondary pcfa-course-action w-100">教材</a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/student/assignments(courseId=${course.id})}"
               class="btn btn-outline-warning pcfa-course-action w-100">課題</a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/chat(courseId=${course.id})}"
               class="btn btn-outline-info pcfa-course-action w-100 position-relative">
                チャット
                <span th:if="${chatUnread > 0}" class="pcfa-chat-badge" th:text="${chatUnread}"></span>
            </a>
        </div>
    </div>

    <section class="panel mb-3">
        <div class="panel-header">
            <h2 class="h6 mb-0 section-title"><i class="bi bi-megaphone"></i><span>お知らせ</span></h2>
        </div>
        <div class="panel-body">
            <div th:if="${announcements.empty}" class="text-muted small py-2">お知らせはありません。</div>
            <div th:each="a : ${announcements}" class="pcfa-announce-item">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <h6 class="fw-bold mb-1" th:text="${a.title}"></h6>
                    <span class="text-muted small text-nowrap"
                          th:text="${#temporals.format(a.createdAt, 'MM/dd HH:mm')}"></span>
                </div>
                <p class="text-muted small mb-1" th:text="${a.author.name} + ' 先生'"></p>
                <p class="mb-0 small" style="white-space:pre-wrap" th:text="${a.content}"></p>
            </div>
        </div>
    </section>

    <div class="row g-3">
        <div class="col-md-6">
            <section class="panel h-100 mb-0">
                <div class="panel-header">
                    <h2 class="h6 mb-0 section-title"><i class="bi bi-file-earmark-pdf"></i><span>教材一覧</span></h2>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item small" th:each="m : ${materialList}" th:text="${m.title}"></li>
                    <li class="list-group-item text-muted small" th:if="${materialList.empty}">教材なし</li>
                </ul>
            </section>
        </div>
        <div class="col-md-6">
            <section class="panel h-100 mb-0">
                <div class="panel-header">
                    <h2 class="h6 mb-0 section-title"><i class="bi bi-journal-text"></i><span>課題一覧</span></h2>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item small" th:each="asg : ${assignmentList}">
                        <span th:text="${asg.title}"></span>
                        <span class="text-muted"> — 締切 </span>
                        <span th:text="${#temporals.format(asg.deadline, 'MM/dd HH:mm')}"></span>
                    </li>
                    <li class="list-group-item text-muted small" th:if="${assignmentList.empty}">課題なし</li>
                </ul>
            </section>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
