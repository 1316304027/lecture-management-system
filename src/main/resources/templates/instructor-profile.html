<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'profile', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>プロフィール編集 | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/instructor/home}"><i class="bi bi-arrow-left"></i> 講師ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-person-circle"></i></span>
            <div>
                <p class="eyebrow mb-1">Profile</p>
                <h1 class="h3 mb-1">講師プロフィール</h1>
                <p class="text-muted mb-0">電話番号・自己紹介・顔写真を編集できます（氏名・メールは管理者が管理）</p>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <section class="panel mb-0 pcfa-profile-form-panel">
        <div class="panel-body">
            <div class="text-center mb-4">
                <img th:if="${avatarUrl}" th:src="${avatarUrl}" alt="avatar" class="pcfa-avatar-lg mb-2 rounded-circle">
                <div th:unless="${avatarUrl}" class="pcfa-avatar-placeholder-lg mx-auto mb-2">
                    <span th:text="${#strings.substring(loginUser.name,0,1)}">?</span>
                </div>
                <p class="text-muted small mb-0">JPG / PNG（2MB以内）</p>
            </div>

            <form id="profileForm" th:action="@{/instructor/profile}" method="post">
                <input type="hidden" name="avatarS3Key" id="avatarS3Key" value="">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">顔写真</label>
                    <input type="file" id="avatarFile" class="form-control" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
                    <div id="avatarMsg" class="small mt-1 text-muted"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">氏名</label>
                    <input type="text" class="form-control" th:value="${loginUser.name}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">メール</label>
                    <input type="email" class="form-control" th:value="${loginUser.email}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">電話番号</label>
                    <input type="text" name="phone" class="form-control" th:value="${loginUser.phone}" placeholder="090-1234-5678">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small">自己紹介</label>
                    <textarea name="profileBio" class="form-control" rows="4" maxlength="500"
                              th:text="${loginUser.profileBio}" placeholder="担当コースや経歴など"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">保存する</button>
            </form>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts">
<script>
document.getElementById('avatarFile').addEventListener('change', async function() {
    var file = this.files[0];
    var msg = document.getElementById('avatarMsg');
    var keyInput = document.getElementById('avatarS3Key');
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { msg.className = 'small mt-1 text-danger'; msg.textContent = '2MB以内にしてください'; return; }
    msg.className = 'small mt-1 text-muted'; msg.textContent = 'アップロード中...';
    try {
        var res = await fetch('/instructor/profile/presign-avatar?fileName=' + encodeURIComponent(file.name));
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'presign failed');
        var ct = file.name.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';
        var put = await fetch(data.uploadUrl, { method: 'PUT', body: file, headers: { 'Content-Type': ct } });
        if (!put.ok) throw new Error('S3 upload failed');
        keyInput.value = data.s3Key;
        msg.className = 'small mt-1 text-success'; msg.textContent = '写真アップロード完了。保存ボタンを押してください。';
    } catch (e) {
        msg.className = 'small mt-1 text-danger'; msg.textContent = 'エラー: ' + e.message;
    }
});
</script>
</th:block>
</body>
</html>
