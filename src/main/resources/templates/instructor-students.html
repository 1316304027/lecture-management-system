<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>受講者一覧 | PCFA受講管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-3">
    <a class="navbar-brand" href="/instructor/home">← 講師ホーム</a>
    <span class="text-white small fw-bold" th:text="'受講者一覧 - ' + ${course.name}"></span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container py-4" style="max-width: 960px;">
    <div class="pcfa-page-header mb-4">
        <h1 class="h4 fw-bold mb-1">受講者一覧</h1>
        <p class="text-muted small mb-0" th:text="${course.name} + ' に登録されている受講者です。'"></p>
    </div>

    <div class="card pcfa-course-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width:56px"></th>
                        <th>氏名</th>
                        <th>メール</th>
                        <th style="width:140px">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${studentList}">
                        <td class="text-center">
                            <img th:if="${avatarUrlMap[u.id]}" th:src="${avatarUrlMap[u.id]}" class="pcfa-avatar-sm" alt="">
                            <span th:unless="${avatarUrlMap[u.id]}" class="pcfa-avatar-placeholder-sm"
                                  th:text="${#strings.substring(u.name,0,1)}"></span>
                        </td>
                        <td class="fw-semibold" th:text="${u.name}"></td>
                        <td class="text-muted small" th:text="${u.email}"></td>
                        <td class="text-nowrap">
                            <a th:href="@{/instructor/students/{studentId}/profile(studentId=${u.id}, courseId=${course.id})}"
                               class="btn btn-sm btn-outline-primary">プロフィール</a>
                        </td>
                    </tr>
                    <tr th:if="${studentList.empty}">
                        <td colspan="4" class="text-center text-muted py-4">受講者が登録されていません</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
