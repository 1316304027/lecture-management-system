<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>受講者一覧 | PCFA受講管理システム</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/instructor/home}"><i class="bi bi-arrow-left"></i> 講師ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-people"></i></span>
            <div>
                <p class="eyebrow mb-1">Students</p>
                <h1 class="h3 mb-1">受講者一覧</h1>
                <p class="text-muted mb-0" th:text="${course.name} + ' に登録されている受講者です。'"></p>
            </div>
        </div>
        <div class="heading-actions">
            <a th:href="@{/instructor/attendance(courseId=${course.id})}" class="btn btn-light btn-sm">出欠確認へ</a>
        </div>
    </div>

    <section class="panel mb-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th style="width:56px"></th>
                    <th>氏名</th>
                    <th>メール</th>
                    <th style="width:140px">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${studentList}">
                    <td class="text-center">
                        <img th:if="${avatarUrlMap[u.id]}" th:src="${avatarUrlMap[u.id]}" class="pcfa-avatar-sm rounded-circle" alt="">
                        <span th:unless="${avatarUrlMap[u.id]}" class="pcfa-avatar-placeholder-sm"
                              th:text="${#strings.substring(u.name,0,1)}"></span>
                    </td>
                    <td class="fw-semibold" th:text="${u.name}"></td>
                    <td class="text-muted small" th:text="${u.email}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/instructor/students/{studentId}/profile(studentId=${u.id}, courseId=${course.id}, returnTo=${'/instructor/students?courseId=' + course.id})}"
                           class="btn btn-sm btn-outline-primary">プロフィール</a>
                    </td>
                </tr>
                <tr th:if="${studentList.empty}">
                    <td colspan="4" class="text-center text-muted py-4">受講者が登録されていません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
