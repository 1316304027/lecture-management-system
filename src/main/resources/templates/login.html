<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | PCFA受講管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
    <link rel="stylesheet" href="https://dyb4upvaqqfld.cloudfront.net/static/custom.css">
</head>
<body class="pcfa-body pcfa-login-page">
<div class="pcfa-login-card card">
    <div class="card-header">
        <div class="pcfa-login-logo">🏫</div>
        <div th:replace="~{fragments/project-hierarchy :: badges(false)}"></div>
        <h4 class="fw-bold mb-1 mt-2">PCFA 受講管理システム</h4>
        <p class="text-muted small mb-0">Lecture Management System · AWS 本番環境</p>
    </div>
    <div class="card-body">
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">メールアドレス</label>
                <input type="email" name="email" class="form-control" required placeholder="mail@example.com">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary pcfa-btn-primary w-100">ログイン</button>
        </form>
    </div>
</div>
</body>
</html>
