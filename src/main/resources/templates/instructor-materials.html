<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教材管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-4 shadow-sm">
    <a class="navbar-brand" href="/instructor/home">← ホームへ戻る</a>
    <span class="text-white fw-bold" th:text="'教材管理 - ' + ${course.name}"></span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container py-4" style="max-width: 960px;">

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="pcfa-admin-section mb-4">
        <div class="pcfa-admin-section-header">教材アップロード（PDF・10MB以内）</div>
        <div class="pcfa-admin-section-body">
            <form th:action="@{/instructor/materials}" method="post"
                  enctype="multipart/form-data" class="row g-3 align-items-end">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">タイトル</label>
                    <input type="text" name="title" class="form-control"
                           placeholder="例：第1回 イントロダクション" required maxlength="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">PDFファイル</label>
                    <input type="file" name="file" class="form-control" accept=".pdf" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold d-block">受講者への公開</label>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox"
                               name="published" id="pub" value="true">
                        <label class="form-check-label small" for="pub">アップロード後すぐ公開</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 pcfa-btn-primary">アップロード</button>
                </div>
            </form>
        </div>
    </div>

    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header">登録済み教材</div>
        <div class="pcfa-admin-section-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>タイトル</th>
                            <th class="text-center" style="width:140px">受講者への表示</th>
                            <th style="width:200px">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${materialList}">
                            <td class="fw-semibold" th:text="${m.title}"></td>
                            <td class="text-center">
                                <span th:if="${m.published}" class="badge bg-success">表示中</span>
                                <span th:unless="${m.published}" class="badge bg-secondary">非表示</span>
                            </td>
                            <td class="d-flex gap-1">
                                <form th:action="@{/instructor/materials/{id}/toggle(id=${m.id})}" method="post">
                                    <input type="hidden" name="courseId" th:value="${course.id}">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${m.published} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                            th:text="${m.published} ? '非表示にする' : '表示する'">
                                    </button>
                                </form>
                                <form th:action="@{/instructor/materials/{id}/delete(id=${m.id})}" method="post"
                                      onsubmit="return confirm('この教材を削除してよろしいですか？')">
                                    <input type="hidden" name="courseId" th:value="${course.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${materialList.empty}">
                            <td colspan="3" class="text-muted text-center py-4">教材が登録されていません</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
