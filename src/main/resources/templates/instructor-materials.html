<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/portal-layout :: layout(~{::title}, 'instructor', 'home', ~{::main}, ~{::extraHead}, ~{::extraScripts}, false)}">
<head>
    <title>教材管理</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <a class="pcfa-back-link" th:href="@{/instructor/home}"><i class="bi bi-arrow-left"></i> 講師ホームへ戻る</a>

    <div class="page-heading mb-3">
        <div class="page-heading-copy">
            <span class="page-icon"><i class="bi bi-file-earmark-pdf"></i></span>
            <div>
                <p class="eyebrow mb-1">Materials</p>
                <h1 class="h3 mb-1">教材管理</h1>
                <p class="text-muted mb-0" th:text="${course.name}"></p>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <section class="panel mb-3">
        <div class="panel-header"><h2 class="h6 mb-0">教材アップロード（PDF・10MB以内）</h2></div>
        <div class="panel-body">
            <form th:action="@{/instructor/materials}" method="post"
                  enctype="multipart/form-data" class="row g-3 align-items-end">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">タイトル</label>
                    <input type="text" name="title" class="form-control"
                           placeholder="例：第1回 イントロダクション" required maxlength="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">PDFファイル</label>
                    <input type="file" name="file" class="form-control" accept=".pdf" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold d-block">受講者への公開</label>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" name="published" id="pub" value="true">
                        <label class="form-check-label small" for="pub">アップロード後すぐ公開</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">アップロード</button>
                </div>
            </form>
        </div>
    </section>

    <section class="panel mb-0">
        <div class="panel-header"><h2 class="h6 mb-0">登録済み教材</h2></div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>タイトル</th>
                    <th class="text-center" style="width:140px">受講者への表示</th>
                    <th style="width:200px">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${materialList}">
                    <td class="fw-semibold" th:text="${m.title}"></td>
                    <td class="text-center">
                        <span th:if="${m.published}" class="badge text-bg-success">表示中</span>
                        <span th:unless="${m.published}" class="badge text-bg-secondary">非表示</span>
                    </td>
                    <td class="d-flex gap-1">
                        <form th:action="@{/instructor/materials/{id}/toggle(id=${m.id})}" method="post">
                            <input type="hidden" name="courseId" th:value="${course.id}">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${m.published} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                    th:text="${m.published} ? '非表示にする' : '表示する'"></button>
                        </form>
                        <form th:action="@{/instructor/materials/{id}/delete(id=${m.id})}" method="post"
                              onsubmit="return confirm('この教材を削除してよろしいですか？')">
                            <input type="hidden" name="courseId" th:value="${course.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${materialList.empty}">
                    <td colspan="3" class="text-muted text-center py-4">教材が登録されていません</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</th:block>
<th:block th:fragment="extraScripts"></th:block>
</body>
</html>
