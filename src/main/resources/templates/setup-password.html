<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワード設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body pcfa-login-body">
<div class="container py-5" style="max-width: 480px;">
    <div class="card pcfa-login-card shadow">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold text-center mb-1">パスワード設定</h1>
            <p class="text-muted small text-center mb-4" th:if="${userName}">
                <span th:text="${userName}"></span> 様（<span th:text="${userEmail}"></span>）<br>
                メールのリンクから、ご自身でパスワードを設定してください。
            </p>

            <div th:if="${successMessage}" class="alert alert-success small" th:text="${successMessage}"></div>
            <div th:if="${errorMessage and successMessage == null}" class="alert alert-danger small" th:text="${errorMessage}"></div>

            <form th:if="${token and successMessage == null}" th:action="@{/setup-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">新しいパスワード（8文字以上）</label>
                    <input type="password" name="newPassword" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">確認用パスワード</label>
                    <input type="password" name="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100 pcfa-btn-primary">パスワードを設定する</button>
            </form>

            <div class="text-center mt-3" th:if="${successMessage}">
                <a href="/login" class="btn btn-outline-primary btn-sm">ログイン画面へ</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
