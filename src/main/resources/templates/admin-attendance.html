<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/adminhmd-layout :: layout(~{::title}, 'attendance', ~{::main}, ~{::extraHead}, ~{::extraScripts}, true)}">
<head>
    <title>出欠修正</title>
    <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<th:block th:fragment="main">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show mx-3 mt-2 mb-0" role="alert">
        <strong th:text="${message}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show mx-3 mt-2 mb-0" role="alert">
        <strong th:text="${errorMessage}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="pcfa-split-page">
        <aside class="pcfa-split-sidebar pcfa-split-sidebar--narrow">
            <div class="pcfa-sidebar-panel">
                <div class="pcfa-sidebar-panel-header">① コース</div>
                <div class="pcfa-sidebar-panel-body">
                    <input type="text" class="form-control form-control-sm search-input mb-2" placeholder="検索…"
                           oninput="filterList(this, 'courseList')">
                    <nav class="pcfa-nav-list" id="courseList">
                        <a th:each="c : ${courseList}"
                           th:href="@{/admin/attendance(courseId=${c.id})}"
                           th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
                           th:attr="data-search=${c.name}" th:text="${c.name}"></a>
                    </nav>
                </div>
            </div>
        </aside>

        <aside class="pcfa-split-sidebar pcfa-split-sidebar--narrow" th:if="${selectedCourse != null}">
            <div class="pcfa-sidebar-panel">
                <div class="pcfa-sidebar-panel-header">② 学生</div>
                <div class="pcfa-sidebar-panel-body">
                    <input type="text" class="form-control form-control-sm search-input mb-2" placeholder="検索…"
                           oninput="filterList(this, 'studentList')">
                    <nav class="pcfa-nav-list" id="studentList">
                        <a th:each="u : ${studentList}"
                           th:href="@{/admin/attendance(courseId=${selectedCourse.id}, studentId=${u.id})}"
                           th:classappend="${selectedStudent != null and selectedStudent.id == u.id} ? 'active' : ''"
                           th:attr="data-search=${u.name + ' ' + u.email}" th:text="${u.name}"></a>
                    </nav>
                </div>
            </div>
        </aside>

        <div class="pcfa-split-main">
            <div class="pcfa-split-main-inner">

                <div th:if="${selectedCourse == null}" class="panel">
                    <div class="panel-body text-center py-5 text-muted">
                        <p class="mb-0">← コースを選択してください</p>
                    </div>
                </div>
                <div th:if="${selectedStudent == null and selectedCourse != null}" class="panel">
                    <div class="panel-body text-center py-5 text-muted">
                        <p class="mb-0">← 学生を選択してください</p>
                    </div>
                </div>

                <section class="panel" th:if="${selectedStudent != null}">
                    <div class="panel-header">
                        <div>
                            <h2 class="h5 mb-1 section-title"><i class="bi bi-calendar-check"></i>
                                <span th:text="|出欠修正：${selectedStudent.name} さん|"></span></h2>
                            <p class="text-muted mb-0" th:text="${selectedCourse.name}">コース</p>
                        </div>
                    </div>
                    <div class="panel-body">
                        <p class="text-muted small mb-3">本日以前の授業日のみ修正できます。未来の授業はグレー表示です。授業時間はコース管理の授業日登録時に設定します。</p>

                        <div th:if="${orphanAttendances != null and !orphanAttendances.empty}" class="alert alert-warning py-2 mb-3">
                            <strong>⚠️ 授業日未登録の出席データ</strong>（出席率に含まれています）
                            <table class="table table-sm mb-0 mt-2 bg-white">
                                <tbody>
                                <tr th:each="oa : ${orphanAttendances}">
                                    <td th:text="${oa.date}"></td>
                                    <td><span class="badge bg-warning text-dark">孤立</span></td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/attendance/delete}" method="post" class="d-inline"
                                              onsubmit="return confirm('この出席データを削除しますか？')">
                                            <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                            <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                            <input type="hidden" name="attendanceId" th:value="${oa.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width:120px">授業日</th>
                                        <th style="width:120px">授業時間</th>
                                        <th style="width:100px" class="text-center">出席状態</th>
                                        <th>修正操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="s : ${schedules}"
                                        th:with="
                                            isFuture=${s.lessonDate.isAfter(#temporals.createToday())},
                                            isToday=${s.lessonDate.equals(#temporals.createToday())},
                                            attended=${attendanceMap != null and attendanceMap.containsKey(s.lessonDate) and attendanceMap[s.lessonDate]}"
                                        th:class="${isFuture} ? 'table-secondary' : ''">
                                        <td>
                                            <span th:text="${s.lessonDate}"></span>
                                            <span th:if="${isToday}" class="badge bg-primary ms-1" style="font-size:10px">今日</span>
                                            <span th:if="${isFuture}" class="badge bg-secondary ms-1" style="font-size:10px">未実施</span>
                                        </td>
                                        <td class="small text-muted"
                                            th:text="${T(lecture_management_system.service.ReportService).formatLessonTime(s.startTime, s.endTime)}"></td>
                                        <td class="text-center">
                                            <span th:unless="${isFuture}">
                                                <span th:if="${attended}" class="badge bg-success">出席</span>
                                                <span th:unless="${attended}" class="badge bg-danger">欠席</span>
                                            </span>
                                            <span th:if="${isFuture}" class="text-muted">―</span>
                                        </td>
                                        <td>
                                            <span th:if="${isFuture}" class="text-muted small">授業未実施のため修正不可</span>
                                            <span th:unless="${isFuture}" class="d-flex flex-wrap gap-2">
                                                <form th:action="@{/admin/attendance/update}" method="post">
                                                    <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                                    <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                                    <input type="hidden" name="lessonDate" th:value="${s.lessonDate}">
                                                    <input type="hidden" name="attended" value="true">
                                                    <button type="submit" class="btn btn-sm"
                                                            th:classappend="${attended} ? 'btn-success disabled' : 'btn-outline-success'"
                                                            th:disabled="${attended}">出席</button>
                                                </form>
                                                <form th:action="@{/admin/attendance/update}" method="post">
                                                    <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                                    <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                                    <input type="hidden" name="lessonDate" th:value="${s.lessonDate}">
                                                    <input type="hidden" name="attended" value="false">
                                                    <button type="submit" class="btn btn-sm"
                                                            th:classappend="${!attended} ? 'btn-danger disabled' : 'btn-outline-danger'"
                                                            th:disabled="${!attended}">欠席</button>
                                                </form>
                                            </span>
                                        </td>
                                    </tr>
                                    <tr th:if="${schedules.empty}">
                                        <td colspan="4" class="text-muted text-center py-4">授業日が登録されていません</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-muted small mt-3">
                            <span class="badge bg-success me-1">出席</span>
                            <span class="badge bg-danger me-1">欠席</span>
                            <span class="badge bg-secondary me-1">未実施</span>
                            現在の状態と同じボタンは無効です。
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="extraScripts">
    <script>
    function filterList(input, listId) {
        const q = input.value.toLowerCase();
        document.querySelectorAll('#' + listId + ' a[data-search]').forEach(el => {
            el.style.display = (el.dataset.search || '').toLowerCase().includes(q) ? '' : 'none';
        });
    }
    </script>
</th:block>
</body>
</html>
