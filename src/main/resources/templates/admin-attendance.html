<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>出欠修正</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-4">
    <a class="navbar-brand" href="/admin/home">← 管理者ホーム</a>
    <span class="text-white fw-bold">出欠修正</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container-fluid p-0">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show rounded-0 mb-0" role="alert">
        <strong th:text="${message}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show rounded-0 mb-0" role="alert">
        <strong th:text="${errorMessage}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

<div class="row g-0 pcfa-attendance-layout">

    <div class="col-lg-2 col-md-3 pcfa-attendance-sidebar p-3">
        <div class="pcfa-admin-section mb-3">
            <div class="pcfa-admin-section-header py-2">① コース選択</div>
            <div class="pcfa-admin-section-body py-2">
                <input type="text" class="form-control form-control-sm mb-2" placeholder="コース検索…"
                       oninput="filterList(this, 'courseList')">
                <div class="list-group list-group-flush pcfa-scroll-list" id="courseList">
                    <a th:each="c : ${courseList}"
                       th:href="@{/admin/attendance(courseId=${c.id})}"
                       class="list-group-item list-group-item-action py-2 small"
                       th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
                       th:attr="data-search=${c.name}" th:text="${c.name}"></a>
                    <span th:if="${courseList.empty}" class="text-muted small px-2">コースなし</span>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-2 col-md-3 pcfa-attendance-sidebar p-3 border-start" th:if="${selectedCourse != null}">
        <div class="pcfa-admin-section mb-0">
            <div class="pcfa-admin-section-header py-2">② 学生選択</div>
            <div class="pcfa-admin-section-body py-2">
                <input type="text" class="form-control form-control-sm mb-2" placeholder="名前で検索…"
                       oninput="filterList(this, 'studentList')">
                <div class="list-group list-group-flush pcfa-scroll-list" id="studentList">
                    <a th:each="u : ${studentList}"
                       th:href="@{/admin/attendance(courseId=${selectedCourse.id}, studentId=${u.id})}"
                       class="list-group-item list-group-item-action py-2 small"
                       th:classappend="${selectedStudent != null and selectedStudent.id == u.id} ? 'active' : ''"
                       th:attr="data-search=${u.name + ' ' + u.email}" th:text="${u.name}"></a>
                    <span th:if="${studentList.empty}" class="text-muted small px-2">学生未登録</span>
                </div>
            </div>
        </div>
    </div>

    <div class="col p-4" th:if="${selectedStudent != null}">
        <div class="pcfa-admin-section">
            <div class="pcfa-admin-section-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span>③ 出欠修正：<span th:text="${selectedStudent.name}"></span> さん</span>
                <span class="badge bg-light text-dark" th:if="${selectedCourse != null}" th:text="${selectedCourse.name}"></span>
            </div>
            <div class="pcfa-admin-section-body">
                <p class="text-muted small mb-3">本日以前の授業日のみ修正できます。未来の授業はグレー表示です。</p>

                <div th:if="${orphanAttendances != null and !orphanAttendances.empty}" class="alert alert-warning py-2 mb-3">
                    <strong>⚠️ 授業日未登録の出席データ</strong>（出席率に含まれています）
                    <table class="table table-sm mb-0 mt-2 bg-white">
                        <tbody>
                        <tr th:each="oa : ${orphanAttendances}">
                            <td th:text="${oa.date}"></td>
                            <td><span class="badge bg-warning text-dark">孤立</span></td>
                            <td class="text-end">
                                <form th:action="@{/admin/attendance/delete}" method="post" class="d-inline"
                                      onsubmit="return confirm('この出席データを削除しますか？')">
                                    <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                    <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                    <input type="hidden" name="attendanceId" th:value="${oa.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:140px">授業日</th>
                                <th style="width:100px" class="text-center">出席状態</th>
                                <th>修正操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${schedules}"
                                th:with="
                                    isFuture=${s.lessonDate.isAfter(#temporals.createToday())},
                                    isToday=${s.lessonDate.equals(#temporals.createToday())},
                                    attended=${attendanceMap != null and attendanceMap.containsKey(s.lessonDate) and attendanceMap[s.lessonDate]}"
                                th:class="${isFuture} ? 'table-secondary' : ''">
                                <td>
                                    <span th:text="${s.lessonDate}"></span>
                                    <span th:if="${isToday}" class="badge bg-primary ms-1" style="font-size:10px">今日</span>
                                    <span th:if="${isFuture}" class="badge bg-secondary ms-1" style="font-size:10px">未実施</span>
                                </td>
                                <td class="text-center">
                                    <span th:unless="${isFuture}">
                                        <span th:if="${attended}" class="badge bg-success">出席</span>
                                        <span th:unless="${attended}" class="badge bg-danger">欠席</span>
                                    </span>
                                    <span th:if="${isFuture}" class="text-muted">―</span>
                                </td>
                                <td>
                                    <span th:if="${isFuture}" class="text-muted small">授業未実施のため修正不可</span>
                                    <span th:unless="${isFuture}" class="d-flex flex-wrap gap-2">
                                        <form th:action="@{/admin/attendance/update}" method="post">
                                            <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                            <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                            <input type="hidden" name="lessonDate" th:value="${s.lessonDate}">
                                            <input type="hidden" name="attended" value="true">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${attended} ? 'btn-success disabled' : 'btn-outline-success'"
                                                    th:disabled="${attended}">出席</button>
                                        </form>
                                        <form th:action="@{/admin/attendance/update}" method="post">
                                            <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                            <input type="hidden" name="studentId" th:value="${selectedStudent.id}">
                                            <input type="hidden" name="lessonDate" th:value="${s.lessonDate}">
                                            <input type="hidden" name="attended" value="false">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${!attended} ? 'btn-danger disabled' : 'btn-outline-danger'"
                                                    th:disabled="${!attended}">欠席</button>
                                        </form>
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${schedules.empty}">
                                <td colspan="3" class="text-muted text-center py-4">授業日が登録されていません</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="text-muted small mt-3">
                    <span class="badge bg-success me-1">出席</span>
                    <span class="badge bg-danger me-1">欠席</span>
                    <span class="badge bg-secondary me-1">未実施</span>
                    現在の状態と同じボタンは無効です。
                </div>
            </div>
        </div>
    </div>

    <div class="col d-flex align-items-center justify-content-center text-muted"
         th:if="${selectedStudent == null and selectedCourse != null}">
        <div class="text-center py-5"><p class="mb-0">← 学生を選択してください（検索で絞り込み可）</p></div>
    </div>
    <div class="col d-flex align-items-center justify-content-center text-muted"
         th:if="${selectedCourse == null}">
        <div class="text-center py-5"><p class="mb-0">← コースを選択してください</p></div>
    </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function filterList(input, listId) {
    const q = input.value.toLowerCase();
    document.querySelectorAll('#' + listId + ' a[data-search]').forEach(el => {
        el.style.display = (el.dataset.search || '').toLowerCase().includes(q) ? '' : 'none';
    });
}
</script>
</body>
</html>
