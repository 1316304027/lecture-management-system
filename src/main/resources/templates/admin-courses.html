<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コース管理 | PCFA受講管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/pcfa-theme.css}">
</head>
<body class="pcfa-body">
<nav class="navbar navbar-dark pcfa-navbar px-4">
    <a class="navbar-brand" href="/admin/home">← 管理者ホーム</a>
    <span class="text-white fw-bold">コース管理</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
</nav>

<div class="container-fluid p-0">
<div class="row g-0">

<!-- 左：コース一覧 -->
<div class="col-md-3 border-end bg-white p-3" style="min-height:calc(100vh - 56px);">
    <p class="small fw-bold text-muted text-uppercase mb-2">コース新規作成</p>
    <form th:action="@{/admin/courses/create}" method="post" class="mb-4">
        <input type="text" name="name" class="form-control form-control-sm mb-2" placeholder="コース名" required>
        <textarea name="description" class="form-control form-control-sm mb-2" placeholder="説明（任意）" rows="2"></textarea>
        <button type="submit" class="btn btn-success btn-sm w-100 pcfa-btn-primary">＋ 作成</button>
    </form>
    <p class="small fw-bold text-muted text-uppercase mb-2">コース一覧</p>
    <input type="text" id="courseSearch" class="form-control form-control-sm mb-2" placeholder="検索…" oninput="filterCourses(this.value)">
    <div class="list-group list-group-flush" id="courseList">
        <a th:each="c : ${courseList}" th:href="@{/admin/courses(courseId=${c.id})}"
           class="list-group-item list-group-item-action py-2 small"
           th:classappend="${selectedCourse != null and selectedCourse.id == c.id} ? 'active' : ''"
           th:attr="data-name=${c.name}" th:text="${c.name}"></a>
    </div>
</div>

<!-- 右：詳細 -->
<div class="col-md-9 p-4" th:if="${selectedCourse != null}">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 fw-bold mb-0" th:text="${selectedCourse.name}"></h1>
            <p class="text-muted small mb-0" th:text="${selectedCourse.description} ?: '（説明なし）'"></p>
        </div>
        <form th:action="@{/admin/courses/delete/{id}(id=${selectedCourse.id})}" method="post"
              onsubmit="return confirm('このコースと関連データを削除しますか？')">
            <button type="submit" class="btn btn-sm btn-outline-danger">コース削除</button>
        </form>
    </div>

    <!-- 基本情報 -->
    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header">基本情報</div>
        <div class="pcfa-admin-section-body">
            <form th:action="@{/admin/courses/update/{id}(id=${selectedCourse.id})}" method="post" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">コース名</label>
                    <input type="text" name="name" class="form-control" th:value="${selectedCourse.name}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">説明</label>
                    <input type="text" name="description" class="form-control" th:value="${selectedCourse.description}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 pcfa-btn-primary">更新</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <!-- 講師 -->
        <div class="col-lg-6">
            <div class="pcfa-admin-section h-100 mb-0">
                <div class="pcfa-admin-section-header">担当講師</div>
                <div class="pcfa-admin-section-body">
                    <table class="table table-sm table-hover mb-3" id="instructorTable">
                        <thead class="table-light"><tr><th>氏名</th><th>メール</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${courseInstructors}">
                            <td th:text="${u.name}"></td>
                            <td class="small text-muted" th:text="${u.email}"></td>
                            <td class="text-end">
                                <form th:action="@{/admin/courses/{cid}/remove-user(cid=${selectedCourse.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">解除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${courseInstructors.empty}"><td colspan="3" class="text-muted text-center small">未割当</td></tr>
                        </tbody>
                    </table>
                    <form th:action="@{/admin/courses/{id}/assign-instructor(id=${selectedCourse.id})}" method="post" class="d-flex gap-2">
                        <select name="userId" class="form-select form-select-sm">
                            <option th:each="u : ${instructorCandidates}" th:value="${u.id}" th:text="${u.name}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary text-nowrap">追加</button>
                    </form>
                </div>
            </div>
        </div>
        <!-- 学生 -->
        <div class="col-lg-6">
            <div class="pcfa-admin-section h-100 mb-0">
                <div class="pcfa-admin-section-header">受講学生</div>
                <div class="pcfa-admin-section-body">
                    <table class="table table-sm table-hover mb-3" id="studentTable">
                        <thead class="table-light"><tr><th>氏名</th><th>メール</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${courseStudents}">
                            <td th:text="${u.name}"></td>
                            <td class="small text-muted" th:text="${u.email}"></td>
                            <td class="text-end">
                                <form th:action="@{/admin/courses/{cid}/remove-user(cid=${selectedCourse.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">解除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${courseStudents.empty}"><td colspan="3" class="text-muted text-center small">未割当</td></tr>
                        </tbody>
                    </table>
                    <form th:action="@{/admin/courses/{id}/assign-student(id=${selectedCourse.id})}" method="post" class="d-flex gap-2">
                        <select name="userId" class="form-select form-select-sm">
                            <option th:each="u : ${studentCandidates}" th:value="${u.id}" th:text="${u.name}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-success text-nowrap">追加</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 授業日 -->
    <div class="pcfa-admin-section">
        <div class="pcfa-admin-section-header">授業日管理</div>
        <div class="pcfa-admin-section-body">
            <div class="table-responsive mb-4">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>授業日</th>
                        <th>開始</th>
                        <th>終了</th>
                        <th>出席受付時間帯</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${schedules}">
                        <td th:text="${s.lessonDate}"></td>
                        <td>
                            <span th:if="${s.startTime != null}" th:text="${#temporals.format(s.startTime,'HH:mm')}"></span>
                            <span th:unless="${s.startTime != null}" class="text-muted">―</span>
                        </td>
                        <td>
                            <span th:if="${s.endTime != null}" th:text="${#temporals.format(s.endTime,'HH:mm')}"></span>
                            <span th:unless="${s.endTime != null}" class="text-muted">―</span>
                        </td>
                        <td class="small text-muted">
                            <span th:if="${s.startTime != null}"
                                  th:text="${#temporals.format(s.startTime.minusMinutes(30),'HH:mm')} + ' 〜 ' + ${#temporals.format(s.startTime.plusMinutes(30),'HH:mm')}"></span>
                            <span th:unless="${s.startTime != null}">終日受付</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/courses/{cid}/schedule/delete/{sid}(cid=${selectedCourse.id},sid=${s.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${schedules.empty}"><td colspan="5" class="text-center text-muted py-3">授業日未登録</td></tr>
                    </tbody>
                </table>
            </div>

            <ul class="nav nav-pills mb-3">
                <li class="nav-item"><button class="nav-link active small" data-bs-toggle="tab" data-bs-target="#tabSingle">1件追加</button></li>
                <li class="nav-item"><button class="nav-link small" data-bs-toggle="tab" data-bs-target="#tabBulk">一括追加</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tabSingle">
                    <form th:action="@{/admin/courses/{id}/schedule/add(id=${selectedCourse.id})}" method="post"
                          class="row g-3 align-items-end">
                        <div class="col-auto" th:replace="~{fragments/date-picker :: picker('lesson', '授業日')}"></div>
                        <div class="col-auto" th:replace="~{fragments/time-picker :: picker('start', '開始時刻（任意）')}"></div>
                        <div class="col-auto" th:replace="~{fragments/time-picker :: picker('end', '終了時刻（任意）')}"></div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-warning">追加</button>
                        </div>
                    </form>
                </div>
                <div class="tab-pane fade" id="tabBulk">
                    <form th:action="@{/admin/courses/{id}/schedule/bulk-add(id=${selectedCourse.id})}" method="post">
                        <div class="row g-3 align-items-end mb-3">
                            <div class="col-auto" th:replace="~{fragments/date-picker :: picker('rangeFrom', '開始日')}"></div>
                            <div class="col-auto" th:replace="~{fragments/date-picker :: picker('rangeTo', '終了日')}"></div>
                            <div class="col-auto" th:replace="~{fragments/time-picker :: picker('start', '開始（任意）')}"></div>
                            <div class="col-auto" th:replace="~{fragments/time-picker :: picker('end', '終了（任意）')}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">曜日</label>
                            <div class="d-flex flex-wrap gap-3">
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="MONDAY">月</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="TUESDAY">火</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="WEDNESDAY">水</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="THURSDAY">木</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="FRIDAY">金</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="SATURDAY">土</label>
                                <label class="form-check-label small"><input class="form-check-input me-1" type="checkbox" name="dayOfWeeks" value="SUNDAY">日</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning" onclick="return checkBulkForm()">一括追加</button>
                    </form>
                </div>
            </div>
            <p class="text-muted small mt-3 mb-0">
                ※ 開始時刻を設定すると、出席受付は<strong>開始30分前〜開始30分後</strong>に制限されます。
            </p>
        </div>
    </div>
</div>

<div class="col-md-9 d-flex align-items-center justify-content-center text-muted" th:unless="${selectedCourse != null}">
    <p class="mb-0">← 左のコースを選択してください</p>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function filterCourses(q) {
    q = q.toLowerCase();
    document.querySelectorAll('#courseList a').forEach(el => {
        el.style.display = (el.dataset.name || '').toLowerCase().includes(q) ? '' : 'none';
    });
}
function checkBulkForm() {
    if (!document.querySelector('input[name="dayOfWeeks"]:checked')) {
        alert('曜日を1つ以上選択してください');
        return false;
    }
    return true;
}
</script>
</body>
</html>
